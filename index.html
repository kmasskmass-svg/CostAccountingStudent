/* ============================================================
   و٢ – ٤) مصنع تحت إدارتك
   ============================================================ */
function makeRound(){
  let fixed=pick([20000,24000,30000,36000,40000,50000]);
  const vc=pick([10,12,15,20,25,30]), qty=pick([1000,1200,1500,2000,2400,3000]);
  const kind=pick(["total","unit","fixedunit","price","special"]);
  if(kind==="unit"||kind==="price") fixed=Math.max(qty*8, Math.round(fixed/qty)*qty);
  const total=fixed+vc*qty, unit=total/qty;
  if(kind==="total") return {kind,ans:total,unitTxt:"ريال",
    q:`مصنعك سينتج ${N(qty)} وحدة هذا الشهر. التكاليف الثابتة ${N(fixed)} ريال، والتكلفة المتغيرة ${N(vc)} ريالاً للوحدة. كم إجمالي التكاليف المتوقعة؟`,
    work:`ص = أ + ب س = ${N(fixed)} + ${N(vc)} × ${N(qty)} = <b>${N(total)}</b> ريال`};
  if(kind==="unit") return {kind,ans:Math.round(unit*100)/100,unitTxt:"ريال/وحدة",
    q:`عند إنتاج ${N(qty)} وحدة، وبتكاليف ثابتة ${N(fixed)} ريال وتكلفة متغيرة ${N(vc)} ريالاً للوحدة، كم تبلغ تكلفة الوحدة الواحدة؟`,
    work:`إجمالي التكاليف = ${N(fixed)} + ${N(vc)} × ${N(qty)} = ${N(total)}<br>تكلفة الوحدة = ${N(total)} ÷ ${N(qty)} = <b>${N(Math.round(unit*100)/100)}</b> ريال`};
  if(kind==="fixedunit"){ const q2=qty*2;
    return {kind:"choice", opts:["يبقى كما هو","ينخفض إلى النصف","يتضاعف","يصبح صفراً"], ans:"ينخفض إلى النصف",
      q:`تكاليفك الثابتة ${N(fixed)} ريال عند إنتاج ${N(qty)} وحدة. إذا رفعت الإنتاج إلى ${N(q2)} وحدة (داخل المدى الملائم)، ماذا يحدث لنصيب الوحدة من التكاليف الثابتة؟`,
      work:`قبل: ${N(fixed)} ÷ ${N(qty)} = ${N(fixed/qty)} ريال/وحدة<br>بعد: ${N(fixed)} ÷ ${N(q2)} = ${N(fixed/q2)} ريال/وحدة<br>الإجمالي الثابت لم يتغير، لكن نصيب الوحدة <b>انخفض إلى النصف</b>.`}; }
  if(kind==="price"){
    const profit=Math.max(qty*5, Math.round(pick([20000,30000,40000,50000])/qty)*qty);
    const price=(total+profit)/qty;
    return {kind,ans:Math.round(price*100)/100,unitTxt:"ريال/وحدة",
      q:`تريد تحقيق ربح قدره ${N(profit)} ريال من بيع ${N(qty)} وحدة. تكاليفك الثابتة ${N(fixed)} ريال والمتغيرة ${N(vc)} ريالاً للوحدة. بكم تبيع الوحدة؟`,
      work:`إجمالي التكاليف = ${N(total)}<br>الإيراد المطلوب = ${N(total)} + ${N(profit)} = ${N(total+profit)}<br>السعر = ${N(total+profit)} ÷ ${N(qty)} = <b>${N(Math.round(price*100)/100)}</b> ريال`}; }
  const off=Math.random()<.5 ? vc+pick([3,5,8]) : vc-pick([2,3,4]); const good=off>vc;
  return {kind:"choice", opts:["أقبل الطلب","أرفض الطلب"], ans:good?"أقبل الطلب":"أرفض الطلب",
    q:`وصلك طلب إضافي بسعر ${N(off)} ريالاً للوحدة، وتكلفتك المتغيرة للوحدة ${N(vc)} ريالاً، وطاقتك الإنتاجية تسمح دون زيادة التكاليف الثابتة. ما القرار الأنسب؟`,
    work: good?`السعر ${N(off)} أعلى من التكلفة المتغيرة ${N(vc)}، فكل وحدة تُسهم بـ <b>${N(off-vc)}</b> ريال في تغطية التكاليف الثابتة وزيادة الربح.`
              :`السعر ${N(off)} أقل من التكلفة المتغيرة ${N(vc)}، فكل وحدة تُباع تزيد الخسارة بـ <b>${N(vc-off)}</b> ريال.`};
}
function facStart(one){ S.g={r:makeRound(), n:0, target: one?1:(S.mode==="teams"?1:6), score:0,right:0,wrong:0, val:"", fb:null, picked:null}; }
function facInput(v){ S.g.val=v; }
function facChoice(v){
  const g=S.g; if(g.fb) return; g.picked=v;
  const ok=v===g.r.ans; mark(ok); if(ok) addScore(20);
  else logErr(g.r.q, g.r.ans, v, g.r.work.replace(/<[^>]+>/g,""));
  g.fb={ok}; draw();
}
function facCheck(){
  const g=S.g; if(g.fb) return;
  const v=parseFloat(String(g.val).replace(/[,\s]/g,""));
  if(isNaN(v)){ g.fb={ok:false,bad:true}; return draw(); }
  const ok=Math.abs(v-g.r.ans)<0.02; mark(ok); if(ok) addScore(25);
  else logErr(g.r.q, N(g.r.ans)+" "+(g.r.unitTxt||""), N(v), g.r.work.replace(/<[^>]+>/g,""));
  g.fb={ok}; draw();
}
function facNext(){
  const g=S.g; g.fb=null; g.val=""; g.picked=null;
  if(advance()) return;
  g.n++; if(g.n>=g.target) return finish();
  g.r=makeRound(); draw();
}
function facView(){
  const g=S.g,r=g.r;
  const body = r.kind==="choice" ? opts(r.opts,g.fb,r.ans,g.picked,"GM.facChoice")
    : `<input class="gm-num" inputmode="decimal" placeholder="اكتب الرقم (${E(r.unitTxt)})" value="${E(g.val)}"
        oninput="GM.facInput(this.value)" onkeydown="if(event.key==='Enter')GM.facCheck()" ${g.fb?"disabled":""}>`;
  return `${hud([(S.mode==="teams"||S.mixed)?"🏭 جولة":"🏭 جولة "+(g.n+1)+" / "+g.target])}
    <div class="gm-card"><h3 class="gm-q">${E(r.q)}</h3>${body}
    ${g.fb?(g.fb.bad?`<div class="gm-fb no">اكتب رقماً صحيحاً.</div>`
      :fbBox(g.fb.ok, r.kind==="choice"?r.ans:N(r.ans)+" "+(r.unitTxt||""), null, r.work)+nextBtn("GM.facNext()")):""}
    ${!g.fb&&r.kind!=="choice"?`<div class="gm-actions"><button class="gm-btn p" onclick="GM.facCheck()">تحقّق</button></div>`:""}
    </div>`;
}

function matrixStart(one){

/* ============================================================
   و١ – ٤) ابنِ قائمة تكلفة الإنتاج
   ============================================================ */
function makeStmt(){
  const r=n=>n*1000;
  const matOpen=r(pick([10,15,20,25])), matBuy=r(pick([60,80,100,120,140])), matClose=r(pick([8,12,18,22]));
  const matUsed=matOpen+matBuy-matClose;
  const dl=r(pick([40,50,60,70,80])), moh=r(pick([30,35,45,55,65]));
  const totalMfg=matUsed+dl+moh;
  const wipOpen=r(pick([5,8,10,14])), wipClose=r(pick([4,7,11,16]));
  const finished=totalMfg+wipOpen-wipClose;
  const fgOpen=r(pick([12,18,25,30])), fgClose=r(pick([10,16,22,28]));
  const cogs=finished+fgOpen-fgClose;
  const sales=cogs+r(pick([60,80,100,130,160]));
  return {matOpen,matBuy,matClose,matUsed,dl,moh,totalMfg,wipOpen,wipClose,finished,fgOpen,fgClose,cogs,sales,gross:sales-cogs};
}
function stmtStart(){
  S.g={ phase:0, order:[], pool:sh(GM_STMT_LINES.map((x,i)=>({i,t:x.t}))), fb:null,
        d:makeStmt(), step:0, val:"", score:0,right:0,wrong:0, target:S.mode==="teams"?3:5 };
}
function stmtPick(i){
  const g=S.g; if(g.fb) return;
  const k=g.pool.findIndex(x=>x.i===i); if(k<0) return;
  g.order.push(g.pool[k]); g.pool.splice(k,1); draw();
}
function stmtUndo(){ const g=S.g; if(g.fb||!g.order.length) return; g.pool.push(g.order.pop()); draw(); }
function stmtCheckOrder(){
  const g=S.g;
  if(g.order.length!==GM_STMT_LINES.length){ g.fb=null; g.warn="رتّب كل البنود أولاً."; return draw(); }
  g.warn=null;
  const ok=g.order.every((x,i)=>x.i===i); mark(ok); if(ok) addScore(25);
  else logErr("ترتيب بنود قائمة تكلفة الإنتاج", GM_STMT_LINES.map(x=>x.t).join(" ← "), g.order.map(x=>x.t).join(" ← "),
              "التسلسل: المواد ثم الأجور ثم ت.ص.غ.م = إجمالي التصنيع، ثم تسوية مخزون تحت التشغيل.");
  g.fb={ok, work:GM_STMT_LINES.map((x,i)=>`${i+1}. ${x.t}`).join("<br>")};
  draw();
}
function stmtInput(v){ S.g.val=v; }
function stmtSpecs(){
  const d=S.g.d;
  return [
   {lab:"المواد المباشرة المستخدمة", ans:d.matUsed, pts:15,
    q:`مخزون مواد أول المدة ${N(d.matOpen)} ريال، والمشتريات ${N(d.matBuy)} ريال، ومخزون مواد آخر المدة ${N(d.matClose)} ريال. كم المواد المباشرة المستخدمة؟`,
    w:`${N(d.matOpen)} + ${N(d.matBuy)} − ${N(d.matClose)} = <b>${N(d.matUsed)}</b> ريال`},
   {lab:"إجمالي تكاليف التصنيع", ans:d.totalMfg, pts:15,
    q:`المواد المباشرة المستخدمة ${N(d.matUsed)} ريال، والأجور المباشرة ${N(d.dl)} ريال، والتكاليف الصناعية غير المباشرة ${N(d.moh)} ريال. كم إجمالي تكاليف التصنيع؟`,
    w:`${N(d.matUsed)} + ${N(d.dl)} + ${N(d.moh)} = <b>${N(d.totalMfg)}</b> ريال`},
   {lab:"تكلفة الإنتاج التام", ans:d.finished, pts:20,
    q:`إجمالي تكاليف التصنيع ${N(d.totalMfg)} ريال، ومخزون إنتاج تحت التشغيل أول المدة ${N(d.wipOpen)} ريال وآخر المدة ${N(d.wipClose)} ريال. كم تكلفة الإنتاج التام خلال الفترة؟`,
    w:`${N(d.totalMfg)} + ${N(d.wipOpen)} − ${N(d.wipClose)} = <b>${N(d.finished)}</b> ريال`},
   {lab:"تكلفة البضاعة المباعة", ans:d.cogs, pts:20,
    q:`تكلفة الإنتاج التام ${N(d.finished)} ريال، ومخزون إنتاج تام أول المدة ${N(d.fgOpen)} ريال وآخر المدة ${N(d.fgClose)} ريال. كم تكلفة البضاعة المباعة؟`,
    w:`${N(d.finished)} + ${N(d.fgOpen)} − ${N(d.fgClose)} = <b>${N(d.cogs)}</b> ريال`},
   {lab:"مجمل الربح", ans:d.gross, pts:20,
    q:`المبيعات ${N(d.sales)} ريال وتكلفة البضاعة المباعة ${N(d.cogs)} ريال. كم مجمل الربح؟`,
    w:`${N(d.sales)} − ${N(d.cogs)} = <b>${N(d.gross)}</b> ريال`}
  ];
}
function stmtCheck(){
  const g=S.g, sp=stmtSpecs()[g.step];
  const v=parseFloat(String(g.val).replace(/[,\s]/g,""));
  if(isNaN(v)){ g.warn="اكتب رقماً."; return draw(); }
  g.warn=null;
  const ok=Math.abs(v-sp.ans)<0.5; mark(ok); if(ok) addScore(sp.pts);
  if(!ok) logErr(sp.lab, N(sp.ans)+" ريال", N(v), sp.w.replace(/<[^>]+>/g,""));
  g.fb={ok, ans:N(sp.ans)+" ريال", work:sp.w};
  draw();
}
function stmtNext(){
  const g=S.g; g.fb=null; g.val=""; g.warn=null;
  if(g.phase===0){ g.phase=1; return draw(); }
  g.step++;
  if(S.mode==="teams"){ nextTurn(); if(S.qDone>=S.teamQ) return finish(); }
  if(g.step>=Math.min(g.target,5)) return finish();
  draw();
}
function stmtView(){
  const g=S.g;
  if(g.phase===0){
    return `${hud(["🧾 المرحلة 1: الترتيب"])}
      <div class="gm-card">

        <div class="gm-order">${g.order.length

    </div>`;
}

function acc(k){ return GM_ACCOUNTS[k]; }
function entryText(dr,cr){ return "من "+acc(dr)+" (مدين) — إلى "+acc(cr)+" (دائن)"; }
function entryQs(){
  return sh(GM_ENTRIES.map(e=>{
    // مموّهات: عكس القيد، وحسابان عشوائيان مختلفان
    const set=new Set([e.dr+"|"+e.cr]);
    const cand=[{dr:e.dr,cr:e.cr,ok:true}];
    if(!set.has(e.cr+"|"+e.dr)){ set.add(e.cr+"|"+e.dr); cand.push({dr:e.cr,cr:e.dr,ok:false}); }
    const keys=Object.keys(GM_ACCOUNTS);
    let guard=0;
    while(cand.length<4 && guard++<40){
      const a=pick(keys), b=pick(keys);
      if(a===b) continue;
      const key=a+"|"+b;
      if(set.has(key)) continue;
      set.add(key); cand.push({dr:a,cr:b,ok:false});
    }
    return { ev:e.ev, why:e.why, ans:entryText(e.dr,e.cr), opts:sh(cand).map(c=>entryText(c.dr,c.cr)) };
  }));
}
function entryStart(one){
  const all=entryQs();
  S.g={ qs: one?[all[0]] : all.slice(0, S.mode==="teams"?S.teamQ:9), i:0, score:0,right:0,wrong:0, fb:null, picked:null };
}
function entryAnswer(v){
  const g=S.g; if(g.fb) return;
  const q=g.qs[g.i], ok=v===q.ans; g.picked=v; mark(ok);
  if(ok) addScore(15); else logErr(q.ev, q.ans, v, q.why);
  g.fb={ok,ans:q.ans,why:q.why}; draw();
}
function entryNext(){
  const g=S.g; g.fb=null; g.picked=null;
  if(advance()) return;
  g.i++; if(g.i>=g.qs.length) return finish();
  draw();
}
function entryView(){
  const g=S.g,q=g.qs[g.i];
  return `${hud(["⚖️ "+(g.i+1)+(S.mixed?"":" / "+g.qs.length)])}
    <div class="gm-card"><h3 class="gm-q">ما القيد المحاسبي الصحيح لهذا الحدث؟</h3>
      <div class="gm-item gm-item-sm">${E(q.ev)}</div>
      ${opts(q.opts,g.fb,q.ans,g.picked,"GM.entryAnswer")}
      ${g.fb?fbBox(g.fb.ok,g.fb.ans,g.fb.why)+nextBtn("GM.entryNext()"):""}</div>`;
}

/* ============================================================
   و٣ – ٤) تحميل التكاليف الصناعية والفرق
   ============================================================ */
function makeOH(){
  const dl=1000*pick([40,50,60,80,100,120,150,200]);
  const rate=pick([40,50,60,75,80,120,150]);           // % من الأجور المباشرة
  const applied=Math.round(dl*rate/100);
  const gap=1000*pick([2,3,4,5,6,8,10]);
  const over=Math.random()<.5;                          // محمّل أكثر من الفعلي؟
  const actual=over? applied-gap : applied+gap;
  return { dl, rate, applied, actual, gap, over,
           dir: over?"بالزيادة (تحميل أكثر من الفعلي)":"بالنقص (تحميل أقل من الفعلي)" };
}
function ohStart(){
  S.g={ p:makeOH(), step:0, val:"", fb:null, score:0,right:0,wrong:0, solved:0,
        target:S.mode==="teams"?1:3, treat: pick(GM_OH_TREAT) };
}
function ohInput(v){ S.g.val=v; }
function ohDir(v){
  const g=S.g,p=g.p; if(g.fb) return;
  const ok = (v==="over")===p.over; mark(ok); if(ok) addScore(15);
  else logErr("اتجاه فرق التحميل", p.dir, v==="over"?"بالزيادة":"بالنقص",
              "محمّل أكثر من الفعلي = بالزيادة، ومحمّل أقل = بالنقص.");
  g.fb={ok, kind:"dir", ans:p.dir,
    work:`المحمَّلة ${N(p.applied)} ${p.over?"<b>أكبر من</b>":"<b>أقل من</b>"} الفعلية ${N(p.actual)} ⇐ الفرق ${p.dir}.`};
  draw();
}
function ohTreat(v){
  const g=S.g, t=g.treat; if(g.fb) return;
  const ok=v===t.o[t.c]; mark(ok); if(ok) addScore(15);
  else logErr(t.q, t.o[t.c], v, t.why);
  g.fb={ok, kind:"treat", ans:t.o[t.c], work:t.why};
  draw();
}
function ohCheck(){
  const g=S.g,p=g.p;
  const v=parseFloat(String(g.val).replace(/[,\s]/g,""));
  if(isNaN(v)){ g.warn="اكتب رقماً."; return draw(); }
  g.warn=null;
  const sp = g.step===0
    ? {t:p.applied, pts:15, lab:"ت.ص.غ.م المحمَّلة", w:`ت.ص.غ.م المحمَّلة = الأجور المباشرة × المعدل = ${N(p.dl)} × ${p.rate}% = <b>${N(p.applied)}</b> ريال`}
    : {t:p.gap, pts:15, lab:"فرق التحميل", w:`فرق التحميل = |${N(p.applied)} − ${N(p.actual)}| = <b>${N(p.gap)}</b> ريال`};
  const ok=Math.abs(v-sp.t)<0.5; mark(ok); if(ok) addScore(sp.pts);
  if(!ok) logErr(sp.lab, N(sp.t)+" ريال", N(v), sp.w.replace(/<[^>]+>/g,""));
  g.fb={ok, kind:"num", ans:N(sp.t)+" ريال", work:sp.w};
  draw();
}
function ohNext(){
  const g=S.g; g.fb=null; g.val=""; g.warn=null; g.step++;
  if(g.step>3){
    g.solved++; g.step=0;
    if(S.mode==="teams"){ nextTurn(); if(S.qDone>=S.teamQ) return finish(); }
    else if(g.solved>=g.target) return finish();
    g.p=makeOH(); g.treat=pick(GM_OH_TREAT);
  }
  draw();
}
function ohView(){
  const g=S.g,p=g.p,st=g.step;
  const names=["احسب المحمَّلة","احسب الفرق","اتجاه الفرق","معالجة الفرق"];
  const steps=`<div class="gm-steps">${names.map((n,i)=>`<div class="gm-step ${i===st?"on":i<st?"done":""}">${i+1}. ${n}</div>`).join("")}</div>`;
  let body="";
  if(st===0){
    body=`<div class="gm-eq">ت.ص.غ.م المحمَّلة = الأجور المباشرة × المعدل التقديري</div>
      <p class="gm-q">الأجور المباشرة ${N(p.dl)} ريال، ومعدل التحميل ${p.rate}% من الأجور المباشرة. كم ت.ص.غ.م المحمَّلة؟</p>
      <input class="gm-num" inputmode="decimal" placeholder="اكتب الرقم (ريال)" value="${E(g.val)}"
        oninput="GM.ohInput(this.value)" onkeydown="if(event.key==='Enter')GM.ohCheck()" ${g.fb?"disabled":""}>`;
  } else if(st===1){
    body=`<div class="gm-eq">المحمَّلة ${N(p.applied)} ريال &nbsp;·&nbsp; الفعلية ${N(p.actual)} ريال</div>
      <p class="gm-q">كم فرق تحميل ت.ص.غ.م (بالقيمة المطلقة)؟</p>
      <input class="gm-num" inputmode="decimal" placeholder="اكتب الرقم (ريال)" value="${E(g.val)}"
        oninput="GM.ohInput(this.value)" onkeydown="if(event.key==='Enter')GM.ohCheck()" ${g.fb?"disabled":""}>`;
  } else if(st===2){
    const b=(v,l)=>{ let c="gm-opt"; if(g.fb){ const isOver=(v==="over"); if(isOver===p.over) c+=" right"; }
      return `<button class="${c}" ${g.fb?"disabled":""} onclick="GM.ohDir('${v}')"><span>${l}</span></button>`; };
    body=`<div class="gm-eq">المحمَّلة ${N(p.applied)} ريال &nbsp;·&nbsp; الفعلية ${N(p.actual)} ريال</div>
      <p class="gm-q">في أي اتجاه يكون فرق التحميل؟</p>
      <div class="gm-opts">${b("over","بالزيادة — المحمَّلة أكبر من الفعلية")}${b("under","بالنقص — المحمَّلة أقل من الفعلية")}</div>`;
  } else {
    body=`<p class="gm-q">${E(g.treat.q)}</p>${opts(g.treat.o,g.fb,g.treat.o[g.treat.c],null,"GM.ohTreat")}`;
  }
  return `${hud([S.mode==="teams"?"🏭 مسألة":"🏭 مسألة "+(g.solved+1)+" / "+g.target])}
    ${steps}
    <div class="gm-card">${body}
      ${g.warn?`<div class="gm-fb no">${E(g.warn)}</div>`:""}
      ${g.fb?`<div class="gm-fb ${g.fb.ok?"ok":"no"}"><b>${g.fb.ok?"إجابة صحيحة":"إجابة غير صحيحة"}${g.fb.ans?" — الإجابة النموذجية: "+E(g.fb.ans):""}</b></div>
        <div class="gm-work"><b>الحل:</b><br>${g.fb.work}</div>`:""}
      <div class="gm-actions">${g.fb
        ?`<button class="gm-btn p" onclick="GM.ohNext()">${st>=3?"مسألة جديدة ←":"الخطوة التالية ←"}</button>`
        :(st===0||st===1?`<button class="gm-btn p" onclick="GM.ohCheck()">تحقّق</button>`:"")}</div>
    </div>`;
}

/* ============================================================
   و٤ – ١) آلة حاسبة التعادل
   ============================================================ */
function makeBE(){
  // نختار سعر البيع ونسبة الهامش بحيث يخرج هامش المساهمة عدداً صحيحاً والنسبة مضبوطة
  let sp, cmr, cm;
  do { sp=pick([100,120,150,160,200,250]); cmr=pick([25,40,50,60,75,80]); cm=sp*cmr/100; }
  while(!Number.isInteger(cm));
  const vc=sp-cm;                                  // التكلفة المتغيرة للوحدة
  const beU=pick([1000,1500,2000,2500,3000,4000]); // نقطة التعادل بالوحدات
  const fc=cm*beU;                                 // التكاليف الثابتة الموافقة
  const beV=sp*beU;                                // التعادل بالقيمة = ثابتة ÷ نسبة الهامش = sp × beU
  return { sp, vc, cm, fc, beU, cmr, beV, name:pick(["شركة الماجد","مصنع النور","شركة الرواد","منشأة الوفاء"]) };
}
function beStart(){ S.g={p:makeBE(), step:0, val:"", fb:null, warn:null, score:0,right:0,wrong:0, solved:0, target:S.mode==="teams"?1:3}; }
function beInput(v){ S.g.val=v; }
function beSpecs(){
  const p=S.g.p;
  return [
   {lab:"هامش المساهمة للوحدة", ans:p.cm, pts:15, u:"ريال",
    q:`في ${p.name}: سعر بيع الوحدة ${N(p.sp)} ريال، والتكلفة المتغيرة للوحدة ${N(p.vc)} ريال. كم هامش المساهمة للوحدة؟`,
    w:`هامش المساهمة = سعر البيع − التكلفة المتغيرة = ${N(p.sp)} − ${N(p.vc)} = <b>${N(p.cm)}</b> ريال`},
   {lab:"نقطة التعادل بالوحدات", ans:p.beU, pts:20, u:"وحدة",
    q:`التكاليف الثابتة ${N(p.fc)} ريال، وهامش المساهمة للوحدة ${N(p.cm)} ريال. كم نقطة التعادل بالوحدات؟`,
    w:`نقطة التعادل = التكاليف الثابتة ÷ هامش المساهمة للوحدة = ${N(p.fc)} ÷ ${N(p.cm)} = <b>${N(p.beU)}</b> وحدة`},
   {lab:"نسبة هامش المساهمة", ans:p.cmr, pts:15, u:"%", pct:true,
    q:`هامش المساهمة للوحدة ${N(p.cm)} ريال وسعر البيع ${N(p.sp)} ريال. كم نسبة هامش المساهمة (٪)؟`,
    w:`نسبة هامش المساهمة = هامش المساهمة ÷ سعر البيع = ${N(p.cm)} ÷ ${N(p.sp)} = <b>${p.cmr}%</b>`},
   {lab:"التعادل بالقيمة", ans:p.beV, pts:20, u:"ريال",
    q:`التكاليف الثابتة ${N(p.fc)} ريال ونسبة هامش المساهمة ${p.cmr}%. كم التعادل بقيمة المبيعات؟`,
    w:`التعادل بالقيمة = التكاليف الثابتة ÷ نسبة هامش المساهمة = ${N(p.fc)} ÷ ${p.cmr}% = <b>${N(p.beV)}</b> ريال`}
  ];
}
function beCheck(){
  const g=S.g, sp=beSpecs()[g.step];
  const v=parseFloat(String(g.val).replace(/[,\s%]/g,""));
  if(isNaN(v)){ g.warn="اكتب رقماً."; return draw(); }
  g.warn=null;
  const ok=Math.abs(v-sp.ans) < (sp.pct?0.05:0.5); mark(ok); if(ok) addScore(sp.pts);
  if(!ok) logErr(sp.lab, N(sp.ans)+" "+sp.u, (sp.pct?v:N(v))+"", sp.w.replace(/<[^>]+>/g,""));
  g.fb={ok, ans:(sp.pct?sp.ans+"%":N(sp.ans)+" "+sp.u), work:sp.w};
  draw();
}
function beNext(){
  const g=S.g; g.fb=null; g.val=""; g.warn=null; g.step++;
  if(g.step>3){
    g.solved++; g.step=0;
    if(S.mode==="teams"){ nextTurn(); if(S.qDone>=S.teamQ) return finish(); }
    else if(g.solved>=g.target) return finish();
    g.p=makeBE();
  }
  draw();
}
function beView(){
  const g=S.g, all=beSpecs(), sp=all[g.step];
  return `${hud([S.mode==="teams"?"🎯 مسألة":"🎯 مسألة "+(g.solved+1)+" / "+g.target])}
    <div class="gm-steps">${all.map((x,i)=>`<div class="gm-step ${i===g.step?"on":i<g.step?"done":""}">${i+1}. ${x.lab}</div>`).join("")}</div>

/* ============================================================
   و٤ – ٢) الربح المستهدف وهامش الأمان
   ============================================================ */
function makeTP(){
  const cm=pick([30,40,50,60,75]);
  const vc=pick([20,30,40,50]);
  const sp=vc+cm;
  const beU=pick([2000,2500,3000,4000]);
  const fc=cm*beU;
  const profit=cm*pick([1000,1500,2000,2500,3000]);   // ربح مستهدف يخرج وحدات صحيحة
  const tpU=(fc+profit)/cm;                            // وحدات الربح المستهدف
  const actual=tpU + pick([500,1000,1500,2000]);       // مبيعات فعلية أعلى من التعادل
  const mos=Math.round((actual-beU)/actual*10000)/100; // هامش الأمان %
  return { sp, vc, cm, fc, beU, profit, tpU, actual, mos, name:pick(["شركة الماجد","مصنع الإبداع","شركة القمة","منشأة التقدم"]) };
}
function tpStart(){ S.g={p:makeTP(), step:0, val:"", fb:null, warn:null, score:0,right:0,wrong:0, solved:0, target:S.mode==="teams"?1:3}; }
function tpInput(v){ S.g.val=v; }
function tpSpecs(){
  const p=S.g.p;
  return [
   {lab:"هامش المساهمة للوحدة", ans:p.cm, pts:15, u:"ريال",
    q:`في ${p.name}: سعر البيع ${N(p.sp)} ريال والتكلفة المتغيرة للوحدة ${N(p.vc)} ريال. كم هامش المساهمة للوحدة؟`,
    w:`هامش المساهمة = ${N(p.sp)} − ${N(p.vc)} = <b>${N(p.cm)}</b> ريال`},
   {lab:"وحدات الربح المستهدف", ans:p.tpU, pts:20, u:"وحدة",
    q:`تريد ${p.name} ربحاً مستهدفاً ${N(p.profit)} ريال، وتكاليفها الثابتة ${N(p.fc)} ريال وهامش المساهمة ${N(p.cm)} ريال. كم وحدة يجب بيعها؟`,
    w:`الوحدات = (التكاليف الثابتة + الربح المستهدف) ÷ هامش المساهمة = (${N(p.fc)} + ${N(p.profit)}) ÷ ${N(p.cm)} = ${N(p.fc+p.profit)} ÷ ${N(p.cm)} = <b>${N(p.tpU)}</b> وحدة`},
   {lab:"هامش الأمان (٪)", ans:p.mos, pts:20, u:"%", pct:true,
    q:`مبيعات ${p.name} الفعلية ${N(p.actual)} وحدة، ونقطة التعادل ${N(p.beU)} وحدة. كم هامش الأمان (٪)؟`,
    w:`هامش الأمان = (الفعلية − التعادل) ÷ الفعلية = (${N(p.actual)} − ${N(p.beU)}) ÷ ${N(p.actual)} = ${N(p.actual-p.beU)} ÷ ${N(p.actual)} = <b>${p.mos}%</b>`}
  ];
}
function tpCheck(){
  const g=S.g, sp=tpSpecs()[g.step];
  const v=parseFloat(String(g.val).replace(/[,\s%]/g,""));
  if(isNaN(v)){ g.warn="اكتب رقماً."; return draw(); }
  g.warn=null;
  const ok=Math.abs(v-sp.ans) < (sp.pct?0.05:0.5); mark(ok); if(ok) addScore(sp.pts);
  if(!ok) logErr(sp.lab, (sp.pct?sp.ans+"%":N(sp.ans)+" "+sp.u), (sp.pct?v:N(v))+"", sp.w.replace(/<[^>]+>/g,""));
  g.fb={ok, ans:(sp.pct?sp.ans+"%":N(sp.ans)+" "+sp.u), work:sp.w};
  draw();
}
function tpNext(){
  const g=S.g; g.fb=null; g.val=""; g.warn=null; g.step++;
  if(g.step>2){
    g.solved++; g.step=0;
    if(S.mode==="teams"){ nextTurn(); if(S.qDone>=S.teamQ) return finish(); }

    <div class="gm-steps">${all.map((x,i)=>`<div class="gm-step ${i===g.step?"on":i<g.step?"done":""}">${i+1}. ${x.lab}</div>`).join("")}</div>

        oninput="GM.tpInput(this.value)" onkeydown="if(event.key==='Enter')GM.tpCheck()" ${g.fb?"disabled":""}>

/* ============================================================
   و٤ – ٤) اقرأ خريطة التعادل — اختيار
   ============================================================ */
function cvpSvg(highlight){
  const x0=52,x1=384,y0=208,y1=14;
  const ax=`<line x1="${x0}" y1="${y1}" x2="${x0}" y2="${y0}" stroke="#94a3b8" stroke-width="1.6"/>
            <line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}" stroke="#94a3b8" stroke-width="1.6"/>`;
  const lab=`<text x="${(x0+x1)/2}" y="240" text-anchor="middle" font-size="12" fill="#64748b">حجم المبيعات</text>
             <text x="14" y="111" text-anchor="middle" font-size="12" fill="#64748b" transform="rotate(-90 14 111)">ريال</text>`;
  const fcY=y0-(y0-y1)*0.30;                 // خط التكاليف الثابتة (أفقي)
  const bx=x0+(x1-x0)*0.52, by=y0-(y0-y1)*0.56;  // نقطة التعادل (تقاطع)
  // خط التكاليف الكلية: يبدأ من fcY ويمر بنقطة التعادل ويكمل
  const totEndY=y0-(y0-y1)*0.74;
  // خط الإيرادات: من الأصل عبر نقطة التعادل ويكمل أعلى
  const revEndY=y0-(y0-y1)*0.92;
  const hl=c=>highlight===c?' stroke-width="4.5"':' stroke-width="2.6"';
  const dim=c=>highlight&&highlight!==c?' opacity="0.28"':'';
  // مناطق الربح/الخسارة
  let regions="";
  if(highlight==="profit") regions=`<path d="M ${bx} ${by} L ${x1-6} ${totEndY} L ${x1-6} ${revEndY} Z" fill="#bbf7d0" opacity="0.8"/>`;
  if(highlight==="loss")   regions=`<path d="M ${x0} ${fcY} L ${bx} ${by} L ${x0} ${y0} Z" fill="#fecaca" opacity="0.8"/>`;
  return `<svg viewBox="0 0 400 250" role="img">${regions}${ax}
    <line x1="${x0}" y1="${fcY}" x2="${x1}" y2="${fcY}" stroke="#b45309"${hl("fixed")}${dim("fixed")}/>
    <line x1="${x0}" y1="${fcY}" x2="${x1-6}" y2="${totEndY}" stroke="#dc2626"${hl("total")}${dim("total")}/>
    <line x1="${x0}" y1="${y0}" x2="${x1-6}" y2="${revEndY}" stroke="#047857"${hl("revenue")}${dim("revenue")}/>
    ${highlight==="be"?`<circle cx="${bx}" cy="${by}" r="7" fill="none" stroke="#0f172a" stroke-width="3"/>`:`<circle cx="${bx}" cy="${by}" r="3.5" fill="#0f172a"/>`}
    ${lab}</svg>`;
}

/* ============================================================
   و٥ – ١) آلة حاسبة الانحرافات
   ============================================================ */
function makeVar(){
  const mat = Math.random()<.5;
  // معياري: سعر وكمية للوحدة، وعدد وحدات منتجة → كمية معيارية مسموحة = الوحدات × المعيار للوحدة
  const sp = mat ? pick([6,8,10,12,15]) : pick([4,5,6,8]);          // السعر المعياري (ريال)
  const units = pick([10000,12000,15000,20000]);                   // الوحدات المنتجة
  const stdPerUnit = pick([1,2]);                                  // معيار المدخل للوحدة (كجم أو ساعة)
  const stdQ = units*stdPerUnit;                                   // الكمية المعيارية المسموح بها
  const priceDelta = pick([0.5,1,1.5,2]) * (Math.random()<.5?1:-1); // فرق السعر الفعلي
  const ap = Math.round((sp+priceDelta)*100)/100;                 // السعر الفعلي
  const qFactor = pick([1.05,1.10,1.15,0.90,0.95]);              // نسبة الكمية الفعلية للمعيارية
  let aq = Math.round(stdQ*qFactor/50)*50;                        // الكمية الفعلية (مضاعفات 50)
  if(aq===stdQ) aq += 500;
  const priceVar = Math.round((ap-sp)*aq*100)/100;               // انحراف السعر
  const effVar = Math.round((aq-stdQ)*sp*100)/100;               // انحراف الكفاءة
  const total = Math.round((priceVar+effVar)*100)/100;
  return { mat, sp, ap, aq, stdQ, units, stdPerUnit, priceVar, effVar, total,
           qU: mat?"كجم":"ساعة", nm: mat?"المواد المباشرة":"الأجور المباشرة",
           priceLbl: mat?"سعر الكيلوجرام":"معدل أجر الساعة" };
}
function favWord(v){ return v>0 ? "في غير صالح المنشأة" : v<0 ? "في صالح المنشأة" : "لا انحراف"; }
function varcStart(){ S.g={p:makeVar(), step:0, val:"", fb:null, warn:null, score:0,right:0,wrong:0, solved:0, target:S.mode==="teams"?1:3}; }
function varcInput(v){ S.g.val=v; }
function varcSpecs(){
  const p=S.g.p;
  return [
   {lab:"انحراف السعر", ans:p.priceVar, pts:20,
    q:`في تحليل ${p.nm}: السعر المعياري ${N(p.sp)} ريال والسعر الفعلي ${N(p.ap)} ريال، والكمية الفعلية ${N(p.aq)} ${p.qU}. كم انحراف السعر؟ (بالقيمة المطلقة)`,
    w:`انحراف السعر = (السعر الفعلي − المعياري) × الكمية الفعلية = (${N(p.ap)} − ${N(p.sp)}) × ${N(p.aq)} = <b>${N(Math.abs(p.priceVar))}</b> ريال ${favWord(p.priceVar)}`,
    real:Math.abs(p.priceVar)},
   {lab:"انحراف الكفاءة", ans:Math.abs(p.effVar), pts:20,
    q:`الكمية الفعلية ${N(p.aq)} ${p.qU}، والكمية المعيارية المسموح بها ${N(p.stdQ)} ${p.qU} (${N(p.units)} وحدة × ${p.stdPerUnit} ${p.qU})، والسعر المعياري ${N(p.sp)} ريال. كم انحراف الكفاءة؟`,
    w:`انحراف الكفاءة = (الكمية الفعلية − المعيارية المسموحة) × السعر المعياري = (${N(p.aq)} − ${N(p.stdQ)}) × ${N(p.sp)} = <b>${N(Math.abs(p.effVar))}</b> ريال ${favWord(p.effVar)}`,
    real:Math.abs(p.effVar)},
   {lab:"الانحراف الإجمالي", ans:Math.abs(p.total), pts:15,
    q:`انحراف السعر ${N(Math.abs(p.priceVar))} ريال ${favWord(p.priceVar)}، وانحراف الكفاءة ${N(Math.abs(p.effVar))} ريال ${favWord(p.effVar)}. كم الانحراف الإجمالي (بالقيمة المطلقة)؟`,
    w:`الانحراف الإجمالي = انحراف السعر + انحراف الكفاءة (بإشارتيهما) = ${p.priceVar<0?"−":""}${N(Math.abs(p.priceVar))} ${p.effVar<0?"− ":"+ "}${N(Math.abs(p.effVar))} = <b>${N(Math.abs(p.total))}</b> ريال ${favWord(p.total)}`,
    real:Math.abs(p.total)}
  ];
}

function varcNext(){

function varcView(){

      <button class="gm-opt" onclick="GM.varcDir('unfav')"><span>في غير صالح المنشأة</span></button></div>` : "";
  return `${hud([S.mode==="teams"?"🧮 مسألة":"🧮 مسألة "+(g.solved+1)+" / "+g.target])}
    <div class="gm-steps">${all.map((x,i)=>`<div class="gm-step ${i===g.step?"on":i<g.step?"done":""}">${i+1}. ${x.lab}</div>`).join("")}</div>
    <div class="gm-card">
      <div class="gm-eq">انحراف السعر = (الفعلي − المعياري) × الكمية الفعلية</div>
      <h3 class="gm-q">${E(sp.q)}</h3>
      <input class="gm-num" inputmode="decimal" placeholder="اكتب الرقم (ريال)" value="${E(g.val)}"
        oninput="GM.varcInput(this.value)" onkeydown="if(event.key==='Enter')GM.varcCheck()" ${g.fb?"disabled":""}>
      ${g.warn?`<div class="gm-fb no">${E(g.warn)}</div>`:""}
      ${g.fb?`<div class="gm-fb ${g.fb.ok?"ok":"no"}"><b>${g.fb.ok?"إجابة صحيحة":"إجابة غير صحيحة"} — الإجابة النموذجية: ${E(g.fb.ans)}</b></div>
        <div class="gm-work"><b>الحل:</b><br>${g.fb.work}</div>`:""}
      ${g.fb&&!g.fb2?`<p class="gm-q" style="margin-top:12px">وما اتجاه هذا الانحراف؟</p>`:""}

      <div class="gm-actions">${g.fb

/* ============================================================

  const g=S.g,it=g.deck[g.i];
  const btn=k=>{ let c="sb-"+(k==="p"?"f":"m"); if(g.fb){ if(k===it.k) c+=" right"; else if(k===g.picked) c+=" wrong"; }
    return `<button class="${c}" ${g.fb?"disabled":""} onclick="GM.vkindAnswer('${k}')">${VK[k]}<span>${VKSUB[k]}</span></button>`; };
  return `${hud(["📦 "+(g.i+1)])}
    <div class="gm-item ${g.fb?(g.fb.ok?"ok":"no"):""}">${E(it.t)}</div>
    <div class="gm-sortbtns" style="grid-template-columns:1fr 1fr">${btn("p")}${btn("e")}</div>
    ${g.fb?`<div class="gm-fb ${g.fb.ok?"ok":"no"}">
      <b>${g.fb.ok?"إجابة صحيحة":"إجابة غير صحيحة"} — النوع الصحيح: ${g.fb.cat}</b>
      ${g.fb.ok&&g.fb.mult>1?`<span class="gm-combo">×${g.fb.mult} سلسلة ${g.streak}</span>`:""}
      <div>${E(g.fb.why)}</div></div>${nextBtn("GM.vkindNext()")}`:""}`;
}

/* ============================================================
   و٥ – ٣) مواتٍ أم غير مواتٍ؟
   ============================================================ */
const FAV={f:"في صالح المنشأة",u:"في غير صالح المنشأة"};
const FAVSUB={f:"مواتٍ",u:"غير مواتٍ"};
function favStart(one){
  S.g={deck:sh(GM_FAV), i:0, score:0,right:0,wrong:0, streak:0,bestStreak:0, lives:3, t:SORT_TIME, fb:null, picked:null};
  if(!one && S.mode==="solo") startTimer();
}
function favAnswer(k){
  const g=S.g; if(g.fb) return;
  const it=g.deck[g.i], ok=it.k===k; g.picked=k; mark(ok);
  if(ok){ g.streak++; g.bestStreak=Math.max(g.bestStreak,g.streak);
    const mult=g.streak>=8?3:g.streak>=4?2:1; addScore(10*mult); g.fb={ok:true,mult,why:it.why,cat:FAV[it.k]}; }
  else { g.streak=0; g.lives--; g.fb={ok:false,why:it.why,cat:FAV[it.k]}; logErr(it.t,FAV[it.k],FAV[k],it.why); }
  draw();
}
function favNext(){
  const g=S.g; g.fb=null; g.picked=null;
  if(advance()) return;
  g.i++; if(g.lives<=0) return finish();
  if(g.i>=g.deck.length){ g.deck=sh(GM_FAV); g.i=0; }
  draw();
}
function favView(){
  const g=S.g,it=g.deck[g.i];
  const btn=k=>{ let c="sb-"+(k==="f"?"f":"v"); if(g.fb){ if(k===it.k) c+=" right"; else if(k===g.picked) c+=" wrong"; }
    return `<button class="${c}" ${g.fb?"disabled":""} onclick="GM.favAnswer('${k}')">${FAV[k]}<span>${FAVSUB[k]}</span></button>`; };
  return `${hud(["📦 "+(g.i+1)])}
    <div class="gm-item ${g.fb?(g.fb.ok?"ok":"no"):""}">${E(it.t)}</div>
    <div class="gm-sortbtns" style="grid-template-columns:1fr 1fr">${btn("f")}${btn("u")}</div>
    ${g.fb?`<div class="gm-fb ${g.fb.ok?"ok":"no"}">
      <b>${g.fb.ok?"إجابة صحيحة":"إجابة غير صحيحة"} — الاتجاه الصحيح: ${g.fb.cat}</b>
      ${g.fb.ok&&g.fb.mult>1?`<span class="gm-combo">×${g.fb.mult} سلسلة ${g.streak}</span>`:""}
      <div>${E(g.fb.why)}</div></div>${nextBtn("GM.favNext()")}`:""}`;
}

/* ============================================================
   و٥ – ٤) مفاهيم المعيارية
   ============================================================ */
function stdStart(one){
  const all=sh(GM_STD_CONCEPT.map(q=>({q:q.q, opts:q.o.slice(), ans:q.o[q.c], why:q.why})));
  S.g={ qs: one?[all[0]] : all.slice(0, S.mode==="teams"?S.teamQ:8), i:0, score:0,right:0,wrong:0, fb:null, picked:null };
}
function stdAnswer(v){
  const g=S.g; if(g.fb) return;
  const q=g.qs[g.i], ok=v===q.ans; g.picked=v; mark(ok);
  if(ok) addScore(12); else logErr(q.q, q.ans, v, q.why);
  g.fb={ok,ans:q.ans,why:q.why}; draw();
}
function stdNext(){
  const g=S.g; g.fb=null; g.picked=null;
  if(advance()) return;
  g.i++; if(g.i>=g.qs.length) return finish();
  draw();
}
function stdView(){
  const g=S.g,q=g.qs[g.i];
  return `${hud(["📊 "+(g.i+1)+(S.mixed?"":" / "+g.qs.length)])}
    <div class="gm-card"><h3 class="gm-q">${E(q.q)}</h3>
      ${opts(q.opts,g.fb,q.ans,g.picked,"GM.stdAnswer")}
      ${g.fb?fbBox(g.fb.ok,g.fb.ans,g.fb.why)+nextBtn("GM.stdNext()"):""}</div>`;
}

/* ============================================================
   تحدٍّ شامل
   ============================================================ */
const STARTERS={ sort:sortStart, charts:chartsStart, highlow:hlStart, factory:facStart,
                 matrix:matrixStart, func:funcStart, cmp:cmpStart, stmt:stmtStart,
                 jvp:jvpStart, doc:docStart, entry:entryStart, oh:ohStart,
                 be:beStart, target:tpStart, sens:sensStart, cvp:cvpStart,
                 varc:varcStart, vkind:vkindStart, fav:favStart, std:stdStart };
const VIEWS={ sort:sortView, charts:chartsView, highlow:hlView, factory:facView,
              matrix:matrixView, func:funcView, cmp:cmpView, stmt:stmtView,
              jvp:jvpView, doc:docView, entry:entryView, oh:ohView,
              be:beView, target:tpView, sens:sensView, cvp:cvpView,
              varc:varcView, vkind:vkindView, fav:favView, std:stdView };
function mixPool(){
  const out=[];
  unitIds().forEach(u=> Object.keys(UNITS_DEF[u].games).forEach(g=>{ if(ONESHOT[g]) out.push(g); }));
  return out;
}
function mixedOne(){ const k=pick(mixPool()); S.game=k; STARTERS[k](true); }
function mixedStart(){
  S.mixed=true;
  S.mix={ n:0, score:0, right:0, wrong:0, target: S.mode==="teams"?S.teamQ:15 };
  mixedOne();
}

/* ============================================================
   عناصر واجهة مشتركة
   ============================================================ */
function opts(list, fb, ans, picked, fn){
  return `<div class="gm-opts">${list.map((o,i)=>{
    let c="gm-opt"; if(fb){ if(o===ans) c+=" right"; else if(o===picked) c+=" wrong"; }
    return `<button class="${c}" ${fb?"disabled":""} onclick="${fn}(${J(o)})">
      <span class="l">${LBL[i]}.</span><span>${E(o)}</span></button>`; }).join("")}</div>`;
}
function fbBox(ok, ans, why, work){
  return `<div class="gm-fb ${ok?"ok":"no"}">
      <b>${ok?"إجابة صحيحة":"إجابة غير صحيحة"}${ans?" — الإجابة النموذجية: "+E(ans):""}</b>
      ${why?`<div>${E(why)}</div>`:""}</div>
    ${work?`<div class="gm-work"><b>الحل:</b><br>${work}</div>`:""}`;
}
function nextBtn(fn){ return `<div class="gm-actions"><button class="gm-btn p" onclick="${fn}">التالي ←</button></div>`; }

function startTimer(){
  stopTimer();
  tick=setInterval(()=>{
    if(!S||!S.g||S.screen!=="play"||S.mixed) return stopTimer();
    S.g.t--; if(S.g.t<=0){ stopTimer(); return finish(); }
    const el=root&&root.querySelector(".gm-timer i");
    if(el){ el.style.width=(S.g.t/SORT_TIME*100)+"%"; el.parentNode.classList.toggle("low",S.g.t<=15);
      const lb=root.querySelector("[data-t]"); if(lb) lb.textContent=S.g.t; } else draw();
  },1000);
}
function stopTimer(){ if(tick){ clearInterval(tick); tick=null; } }
function nextTurn(){ S.qDone++; S.turn=(S.turn+1)%S.teams.length; }

function hud(stats){
  const g=S.g, T=totals();
  const timed = !S.mixed && S.mode==="solo" && ["sort","matrix","func"].indexOf(S.game)>=0;
  const meta = gameMeta(S.game)||{};
  return `${S.mode==="teams"?`<div class="gm-turnbar">🎯 الدور الآن: ${E(S.teams[S.turn].name)} — السؤال ${S.qDone+1} من ${S.teamQ}</div>
      <div class="gm-teams">${S.teams.map((t,i)=>`<div class="gm-team ${i===S.turn?"turn":""}">
        <div class="nm">${E(t.name)}</div><div class="sc">${t.score}</div>
        ${i===S.turn?`<span class="badge">دوره الآن</span>`:""}</div>`).join("")}</div>`:""}
    <div class="gm-hud">
      ${S.mixed?`<span class="gm-stat">🔀 ${meta.em||""} ${E(meta.name||"")}</span>`:""}
      ${S.mode==="solo"?`<span class="gm-stat">⭐ النقاط <b>${T.score}</b></span>`:""}
      ${S.mixed&&S.mode==="solo"?`<span class="gm-stat">❓ ${S.mix.n+1} / ${S.mix.target}</span>`:""}
      ${stats.map(s=>`<span class="gm-stat">${s}</span>`).join("")}
      <span class="gm-stat">✅ ${T.right}</span><span class="gm-stat">❌ ${T.wrong}</span>
      ${timed?`<span class="gm-stat ${g.lives<=1?"warn":""}">❤️ <b>${g.lives}</b></span>
        <span class="gm-stat"><span data-t>${g.t}</span> ث</span>
        <span class="gm-timer ${g.t<=15?"low":""}"><i style="width:${g.t/SORT_TIME*100}%"></i></span>`:""}
      <button class="gm-btn g sm" onclick="GM.quit()">إنهاء</button>
    </div>`;
}

/* ---------- الشاشات ---------- */
function homeView(){
  const b=bests(), us=unitIds();
  const showUnitPicker = us.length>1 && !S.unit;
  return `
    <div class="gm-hero">
      <h1>🎮 ألعاب محاسبة التكاليف</h1>
      <p>ألعاب تدريبية مبنية على محتوى المقرر: تبويب التكاليف وقوائمها، وسلوكها وطرق قياسها واتخاذ القرار على أساسها.</p>
      <div class="gm-modes">
        <button class="gm-mode ${S.mode==="solo"?"on":""}" onclick="GM.setMode('solo')">👤 فردي للمذاكرة</button>
        <button class="gm-mode ${S.mode==="teams"?"on":""}" onclick="GM.setMode('teams')">👥 تنافس فرق على الشاشة</button>
      </div>
    </div>
    ${S.mode==="teams"?teamSetup():""}
    ${showUnitPicker?`
      <h3 class="gm-h">اختر الوحدة</h3>
      <div class="gm-grid">
        ${us.map(u=>{ const U=UNITS_DEF[u];
          return `<button class="gm-pick" onclick="GM.setUnit('${u}')">
            <span class="em">${U.em}</span><h3>${U.n}</h3><p>${U.s}</p>
            <span class="gm-count">${Object.keys(U.games).length} ألعاب</span></button>`; }).join("")}
        <button class="gm-pick mix" onclick="GM.play('mixed')">
          ${b.mixed?`<span class="tag">أفضل نتيجة ${b.mixed}</span>`:""}
          <span class="em">🔀</span><h3>تحدٍّ شامل</h3>
          <p>أسئلة عشوائية من كل ألعاب الوحدات المتاحة — مناسب للمراجعة قبل الاختبار وللمسابقة الصفية.</p></button>
      </div>`
    :`
      ${us.length>1?`<div class="gm-back"><button class="gm-btn g sm" onclick="GM.setUnit(null)">◀ كل الوحدات</button>
        <span class="gm-unitname">${UNITS_DEF[S.unit].em} ${UNITS_DEF[S.unit].n} — ${UNITS_DEF[S.unit].s}</span></div>`:""}
      <h3 class="gm-h">اختر اللعبة</h3>
      <div class="gm-grid">
        ${Object.keys(UNITS_DEF[S.unit||us[0]].games).map(k=>{ const G=UNITS_DEF[S.unit||us[0]].games[k];
          return `<button class="gm-pick" onclick="GM.play('${k}')">
            ${b[k]?`<span class="tag">أفضل نتيجة ${b[k]}</span>`:""}
            <span class="em">${G.em}</span><h3>${G.name}</h3><p>${G.desc}</p></button>`; }).join("")}
        ${us.length===1?`<button class="gm-pick mix" onclick="GM.play('mixed')">
          ${b.mixed?`<span class="tag">أفضل نتيجة ${b.mixed}</span>`:""}
          <span class="em">🔀</span><h3>تحدٍّ شامل</h3><p>أسئلة عشوائية من كل ألعاب هذه الوحدة.</p></button>`:""}
      </div>`}`;
}
function teamSetup(){
  return `<div class="gm-card" style="margin-bottom:18px">
    <h3 class="gm-h" style="margin-top:0">إعداد الفرق</h3>
    <div class="gm-teams">${S.teams.map((t,i)=>`<div class="gm-team">
      <input class="gm-num gm-tname" value="${E(t.name)}" oninput="GM.teamName(${i},this.value)"></div>`).join("")}</div>
    <div class="gm-actions">
      <button class="gm-btn o sm" onclick="GM.addTeam()" ${S.teams.length>=4?"disabled":""}>＋ فريق</button>
      <button class="gm-btn g sm" onclick="GM.delTeam()" ${S.teams.length<=2?"disabled":""}>− فريق</button>
      <span class="gm-lbl">عدد الأسئلة:</span>
      ${[8,12,16,20].map(n=>`<button class="gm-btn ${S.teamQ===n?"p":"g"} sm" onclick="GM.setQ(${n})">${n}</button>`).join("")}
      <button class="gm-btn ${S.big?"p":"g"} sm" onclick="GM.toggleBig()">🔎 خط كبير للعرض</button>
    </div></div>`;
}
function endView(){
  const T=totals(), meta=gameMeta(S.game)||{};
  if(S.mode==="teams"){
    const sorted=S.teams.slice().sort((a,b)=>b.score-a.score), win=sorted[0];
    return `<div class="gm-card gm-final">
      <div class="gm-medal">🏆</div><h2 class="gm-win">${E(win.name)}</h2>
      <div class="sub">الفريق الفائز بـ ${win.score} نقطة — ${E(S.mixed?"تحدٍّ شامل":(meta.name||""))}</div>
      <div class="gm-teams" style="margin-top:18px">${sorted.map((t,i)=>`<div class="gm-team ${i===0?"turn":""}">
        <div class="nm">${["🥇","🥈","🥉","4️⃣"][i]||""} ${E(t.name)}</div><div class="sc">${t.score}</div></div>`).join("")}</div>
      ${reviewBlock()}${endBtns()}</div>`;
  }
  const tot=T.right+T.wrong, pct=tot?Math.round(T.right/tot*100):0;
  const medal=pct>=90?"🏆":pct>=75?"🥇":pct>=60?"🥈":pct>=40?"🥉":"📘";
  const msg=pct>=90?"إتقان ممتاز":pct>=75?"مستوى جيد جداً":pct>=60?"مستوى جيد، راجع الأخطاء":"يحتاج مراجعة الوحدة";
  const key=S.mixed?"mixed":S.game;
  setBest(key,T.score);
  const bk=bests()[key];
  return `<div class="gm-card gm-final">
    <div class="gm-medal">${medal}</div><div class="big">${T.score}</div>
    <div class="sub">نقطة — ${msg}</div>
    <div class="gm-bars"><div class="gm-bar ${pct<40?"low":pct<70?"mid":""}">
      <div class="lb"><span>نسبة الإجابات الصحيحة</span><span>${pct}%</span></div>
      <div class="tr"><i style="width:${pct}%"></i></div></div></div>
    <div class="gm-sub2">صحيحة ${T.right} · خاطئة ${T.wrong}${T.bestStreak?` · أطول سلسلة ${T.bestStreak}`:""}${bk?` · أفضل نتيجة لك ${bk}`:""}</div>
    ${reviewBlock()}${endBtns()}</div>`;
}
function endBtns(){
  return `<div class="gm-actions gm-center">
    <button class="gm-btn p" onclick="GM.play('${S.mixed?"mixed":S.game}')">إعادة المحاولة</button>
    <button class="gm-btn o" onclick="GM.home()">القائمة الرئيسية</button></div>`;
}
function reviewBlock(){
  if(!S.log.length) return `<div class="gm-fb ok gm-center" style="margin-top:16px">لا أخطاء تُذكر — أداء نظيف.</div>`;
  return `<div class="gm-review"><h3 class="gm-h">📌 راجع هذه النقاط (${S.log.length})</h3>
    ${S.log.slice(0,12).map(x=>`<div class="it"><div>${E(x.q)}</div>
      <div><b>إجابتك: ${E(x.got)}</b> — الإجابة النموذجية: ${E(x.right)}</div>
      <div class="wy">${E(x.why)}</div></div>`).join("")}
    ${S.log.length>12?`<div class="it wy">… و ${S.log.length-12} ملاحظات أخرى</div>`:""}</div>`;
}
function draw(){
  if(!root) return;
  const focus=document.activeElement&&document.activeElement.classList&&document.activeElement.classList.contains("gm-num");
  root.className="gm"+(S.big?" big":"");
  const meta=gameMeta(S.game);
  const title = S.screen==="home" ? "ألعاب محاسبة التكاليف"
    : (S.mixed?"🔀 تحدٍّ شامل — ":"")+((meta&&meta.em||"")+" "+(meta&&meta.name||""));
  root.innerHTML=`<div class="gm-wrap">
    <div class="gm-top">
      <div class="gm-brand"><span class="ic">🎮</span><span>${E(title)}</span></div>
      <div class="sp">
        ${S.screen!=="home"?`<button class="gm-btn g sm" onclick="GM.home()">◀ القائمة</button>`:""}
        <button class="gm-btn ${S.big?"p":"g"} sm" onclick="GM.toggleBig()">🔎 خط كبير</button>
        <button class="gm-btn g sm" onclick="GM.close()">✕ خروج</button>
      </div></div>
    ${S.screen==="home"?homeView():S.screen==="end"?endView():(VIEWS[S.game]||homeView)()}
  </div>`;
  if(focus){ const el=root.querySelector(".gm-num"); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } }
}

/* ---------- واجهة عامة ---------- */
function open(o){
  if(root) return;
  S=fresh();
  if(o&&o.unit&&UNITS_DEF[o.unit]&&unitIds().indexOf(o.unit)>=0) S.unit=o.unit;
  if(unitIds().length===1) S.unit=unitIds()[0];
  root=document.createElement("div"); root.id="gmOverlay"; root.className="gm";
  document.body.appendChild(root);
  document.documentElement.style.overflow="hidden";
  document.addEventListener("keydown",keys);
  draw();
}
function close(){
  stopTimer(); document.removeEventListener("keydown",keys);
  if(root&&root.parentNode) root.parentNode.removeChild(root);
  root=null; S=null; document.documentElement.style.overflow="";
}
function keys(e){
  if(!S) return;
  if(e.key==="Escape"){ e.preventDefault(); if(S.screen==="play") quit(); else close(); return; }
  if(S.screen==="play"&&S.g&&!S.g.fb){
    if(S.game==="sort"){ if(e.key==="1")sortAnswer("f"); if(e.key==="2")sortAnswer("v"); if(e.key==="3")sortAnswer("m"); }
    if(S.game==="func"){ if(e.key==="1")funcAnswer("p"); if(e.key==="2")funcAnswer("s"); if(e.key==="3")funcAnswer("a"); }
    if(S.game==="jvp"){ if(e.key==="1")jvpAnswer("j"); if(e.key==="2")jvpAnswer("p"); }
    if(S.game==="doc"){ if(e.key==="1")docAnswer("cost"); if(e.key==="2")docAnswer("req"); if(e.key==="3")docAnswer("tkt"); }
    if(S.game==="vkind"){ if(e.key==="1")vkindAnswer("p"); if(e.key==="2")vkindAnswer("e"); }
    if(S.game==="fav"){ if(e.key==="1")favAnswer("f"); if(e.key==="2")favAnswer("u"); }
  }
}
function home(){ stopTimer(); S.screen="home"; S.game=null; S.mixed=false; S.g=null; S.mix=null;
  S.log=[]; S.qDone=0; S.turn=0; S.teams.forEach(t=>t.score=0);
  if(unitIds().length===1) S.unit=unitIds()[0];
  draw(); }
function setUnit(u){ S.unit=u; draw(); }
function play(k){
  stopTimer(); S.screen="play"; S.log=[]; S.qDone=0; S.turn=0; S.teams.forEach(t=>t.score=0);
  if(k==="mixed"){ mixedStart(); } else { S.mixed=false; S.game=k; STARTERS[k](false); }
  draw();
}
function finish(){ stopTimer(); S.screen="end"; draw(); }
function quit(){ finish(); }
function setMode(m){ S.mode=m; draw(); }
function setQ(n){ S.teamQ=n; draw(); }
function toggleBig(){ S.big=!S.big; draw(); }
function teamName(i,v){ S.teams[i].name=v; }
function addTeam(){ if(S.teams.length<4){ S.teams.push({name:"الفريق "+["الأول","الثاني","الثالث","الرابع"][S.teams.length],score:0}); draw(); } }
function delTeam(){ if(S.teams.length>2){ S.teams.pop(); draw(); } }

return { open, close, home, play, quit, setUnit, setMode, setQ, toggleBig, teamName, addTeam, delTeam,
  sortAnswer, sortNext, chartsAnswer, chartsNext, hlPickRow, hlInput, hlCheck, hlNext,
  facInput, facChoice, facCheck, facNext,
  matrixAnswer, matrixNext, funcAnswer, funcNext, cmpAnswer, cmpNext,
  stmtPick, stmtUndo, stmtCheckOrder, stmtInput, stmtCheck, stmtNext,
  jvpAnswer, jvpNext, docAnswer, docNext, entryAnswer, entryNext,
  ohInput, ohCheck, ohDir, ohTreat, ohNext,
  beInput, beCheck, beNext, tpInput, tpCheck, tpNext,
  sensAnswer, sensNext, cvpAnswer, cvpNext,
  varcInput, varcCheck, varcDir, varcNext, vkindAnswer, vkindNext,
  favAnswer, favNext, stdAnswer, stdNext };
})();


</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const UNITS = D.units;
const ORD = ["الأولى","الثانية","الثالثة","الرابعة","الخامسة"];
const TYPES = [
  {k:"mcq",   n:"اختيار من متعدد"},
  {k:"tf",    n:"صح وخطأ"},
  {k:"game",  n:"أسئلة الألعاب"},
  {k:"essay", n:"أسئلة مقالية"}
];
const TYPE_NAME = Object.fromEntries(TYPES.map(t=>[t.k,t.n]));
const GAMES = {
  u1:["مصفوفة التبويب","أي وظيفة؟","ابنِ قائمة تكلفة الإنتاج","مالية أم تكاليف؟"],
  u2:["فرز التكاليف","اقرأ الرسم البياني","تحدي أعلى وأدنى مستوى","مصنع تحت إدارتك"],
  u3:["الأوامر أم المراحل؟","المستند الصحيح","قيد اليومية","تحميل التكاليف والفرق"],
  u4:["آلة حاسبة التعادل","الربح المستهدف وهامش الأمان","اتجاه التغيّر","اقرأ خريطة التعادل"],
  u5:["آلة حاسبة الانحرافات","سعر أم كفاءة؟","مواتٍ أم غير مواتٍ؟","مفاهيم المعيارية"]
};
const LBL = ["أ","ب","ج","د","هـ","و"];

/* ---------- بنك موحّد ---------- */
const ALL = [];
UNITS.forEach(u=>{
  (D.mcq[u.id]||[]).forEach((q,i)=>ALL.push({key:"m-"+u.id+"-"+i,u:u.id,type:"mcq",q:q.q,options:q.options,correct:q.correct,why:""}));
  (D.tf[u.id]||[]).forEach((q,i)=>ALL.push({key:"t-"+u.id+"-"+i,u:u.id,type:"tf",q:q.q,options:["صح","خطأ"],correct:q.answer?0:1,why:q.explain||""}));
  (D.game[u.id]||[]).forEach((q,i)=>ALL.push({key:"g-"+u.id+"-"+i,u:u.id,type:"game",q:q.q,options:q.options,correct:q.correct,why:q.why||""}));
  (D.essay[u.id]||[]).forEach((q,i)=>ALL.push({key:"e-"+u.id+"-"+i,u:u.id,type:"essay",q:q.q,a:q.a}));
});
const BYKEY = Object.fromEntries(ALL.map(q=>[q.key,q]));
const unitOf = id=>UNITS.find(u=>u.id===id);

/* ---------- أدوات ---------- */
const esc = s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const shuffle = a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const fmt = n=>Number(n).toLocaleString("en-US");
const LS = "ca_student_v1";
function load(){ try{ return JSON.parse(localStorage.getItem(LS))||{}; }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(LS, JSON.stringify(ST)); }catch(e){} }
const ST = Object.assign({ok:{}, wrong:{}}, load());   // ok: مفاتيح أُجيبت صحيحة، wrong: مفاتيح أخطاء لم تُصحَّح

/* ---------- حالة الواجهة ---------- */
const V = {
  view:"home",
  pr:{ units:{}, types:{mcq:true,tf:true,game:true,essay:false}, count:20 },
  run:null,
  ex:{ units:{}, types:{mcq:true,tf:true,game:false,essay:false}, solved:false, shuffle:true, count:0,
       title:"أسئلة مراجعة", fields:{name:true,section:true,date:false} }
};
UNITS.forEach(u=>{ V.pr.units[u.id]=true; V.ex.units[u.id]=true; });

function go(v){ V.view=v; if(v!=="practice") {} render(); window.scrollTo(0,0); }

/* ---------- التنقل ---------- */
function renderNav(){
  const w = Object.keys(ST.wrong).length;
  const items=[["home","الرئيسية"],["practice","تدرّب"],["games","الألعاب"],["export","الطباعة والتصدير"],["wrong","أخطائي"]];
  document.getElementById("nav").innerHTML = items.map(([k,n])=>
    `<button class="${V.view===k?'on':''}" onclick="go('${k}')">${n}${k==="wrong"&&w?`<span class="cnt">${w}</span>`:""}</button>`).join("");
  document.getElementById("code").textContent = D.settings.code||"";
}

/* ---------- الرئيسية ---------- */
function unitStats(id){
  const qs = ALL.filter(q=>q.u===id && q.type!=="essay");
  const ok = qs.filter(q=>ST.ok[q.key]).length;
  return { total:qs.length, ok, essay:(D.essay[id]||[]).length, pct: qs.length? Math.round(ok/qs.length*100):0 };
}
function viewHome(){
  const rows = UNITS.map((u,i)=>{ const s=unitStats(u.id);
    return `<tr>
      <td class="no">${i+1}</td>
      <td><div class="u-t">${esc(u.subtitle)}</div><div class="u-s">الوحدة ${ORD[i]} · ${GAMES[u.id].length} ألعاب</div></td>
      <td class="num">${fmt(s.total)}</td>
      <td class="num">${fmt(s.ok)}</td>
      <td><div class="bar"><i style="width:${s.pct}%"></i></div><div class="pct">${fmt(s.pct)}٪ من أسئلة الوحدة</div></td>
      <td><div class="acts"><button class="btn btn-p btn-s" onclick="quickPractice('${u.id}')">تدرّب</button>
        <button class="btn btn-o btn-s" onclick="GM.open({unit:'${u.id}'})">العب</button></div></td></tr>`; }).join("");
  const T = UNITS.reduce((a,u)=>{const s=unitStats(u.id); a.t+=s.total; a.o+=s.ok; return a;},{t:0,o:0});
  const tp = T.t?Math.round(T.o/T.t*100):0;
  return `<section class="hero">
      <h1>دفتر مراجعة محاسبة التكاليف</h1>
      <p class="lead">كل وحدة مسجّلة هنا كحساب في دفتر الأستاذ: عدد أسئلتها، وما أجبت عنه صحيحاً، ونسبة إنجازك. تدرّب سؤالاً سؤالاً، أو العب ألعاب الوحدة، أو اطبع ورقة مراجعة.</p>
    </section>
    <div class="ledger"><div class="ledger-scroll"><table class="lg">
      <thead><tr><th style="text-align:center">م</th><th>الوحدة</th><th style="text-align:center">الأسئلة</th><th style="text-align:center">أجبتها صحيحاً</th><th>الإنجاز</th><th></th></tr></thead>
      <tbody>${rows}
      <tr class="total"><td></td><td>الإجمالي</td><td class="num sum">${fmt(T.t)}</td><td class="num sum">${fmt(T.o)}</td>
        <td><div class="bar"><i style="width:${tp}%"></i></div><div class="pct">${fmt(tp)}٪ من المقرر</div></td>
        <td><div class="acts"><button class="btn btn-g btn-s" onclick="go('practice')">مراجعة شاملة</button></div></td></tr>
      </tbody></table></div></div>
    <p class="hint">يُحفظ تقدمك في هذا المتصفح فقط. الأسئلة المقالية (${fmt(ALL.filter(q=>q.type==="essay").length)} سؤالاً) لا تدخل في النسبة لأنك تقيّم إجابتك فيها بنفسك.</p>`;
}
function quickPractice(id){
  UNITS.forEach(u=>V.pr.units[u.id]=(u.id===id)); V.view="practice"; startPractice();
}

/* ---------- التدريب ---------- */
function prPool(){
  return ALL.filter(q=>V.pr.units[q.u] && V.pr.types[q.type]);
}
function chips(obj, fn, labels){
  return labels.map(([k,n,c])=>`<button class="chip ${obj[k]?'on':''}" aria-pressed="${!!obj[k]}" onclick="${fn}('${k}')">${n}${c!=null?` <small>(${fmt(c)})</small>`:""}</button>`).join("");
}
function prUnit(k){ V.pr.units[k]=!V.pr.units[k]; render(); }
function prType(k){ V.pr.types[k]=!V.pr.types[k]; render(); }
function prCount(n){ V.pr.count=n; render(); }
function viewPracticeSetup(){
  const pool = prPool();
  const cnt = [10,20,40,0];
  return `<div class="sec-h"><div><h2>تدرّب</h2><p class="lead">اختر الوحدات ونوع الأسئلة. تظهر الإجابة الصحيحة وتعليلها بعد كل سؤال.</p></div></div>
  <div class="panel">
    <div class="lbl">الوحدات</div>
    <div class="row">${chips(V.pr.units,"prUnit",UNITS.map((u,i)=>[u.id,"الوحدة "+ORD[i]]))}</div>
    <div class="lbl">نوع الأسئلة</div>
    <div class="row">${chips(V.pr.types,"prType",TYPES.map(t=>[t.k,t.n,ALL.filter(q=>q.type===t.k&&V.pr.units[q.u]).length]))}</div>
    <div class="lbl">عدد الأسئلة</div>
    <div class="row">${cnt.map(n=>`<button class="chip ${V.pr.count===n?'on':''}" onclick="prCount(${n})">${n?fmt(n):"كل الأسئلة"}</button>`).join("")}</div>
    <div class="row" style="margin-top:22px">
      <button class="btn btn-p" onclick="startPractice()" ${pool.length?"":"disabled"}>ابدأ التدريب (${fmt(V.pr.count?Math.min(V.pr.count,pool.length):pool.length)} سؤالاً)</button>
      ${pool.length?"":`<span class="hint" style="margin:0">اختر وحدة واحدة ونوع أسئلة واحداً على الأقل.</span>`}
    </div>
  </div>`;
}
function prepare(q){
  if(q.type==="essay"||q.type==="tf") return Object.assign({},q);
  const idx = shuffle(q.options.map((_,i)=>i));
  return Object.assign({},q,{options:idx.map(i=>q.options[i]), correct:idx.indexOf(q.correct)});
}
function startPractice(keys){
  let pool = keys ? keys.map(k=>BYKEY[k]).filter(Boolean) : shuffle(prPool());
  if(!keys && V.pr.count) pool = pool.slice(0,V.pr.count);
  if(!pool.length){ render(); return; }
  V.run = { list:pool.map(prepare), i:0, pick:null, shown:false, right:0, wrongKeys:[], selfOk:0 };
  V.view="practice"; render(); window.scrollTo(0,0);
}
function answer(i){
  const r=V.run, q=r.list[r.i]; if(r.pick!==null) return;
  r.pick=i;
  if(i===q.correct){ r.right++; ST.ok[q.key]=1; delete ST.wrong[q.key]; }
  else { r.wrongKeys.push(q.key); ST.wrong[q.key]=1; }
  save(); render();
}
function reveal(){ V.run.shown=true; render(); }
function selfGrade(ok){
  const r=V.run, q=r.list[r.i]; r.pick = ok?1:0;
  if(ok){ r.selfOk++; r.right++; delete ST.wrong[q.key]; } else { r.wrongKeys.push(q.key); ST.wrong[q.key]=1; }
  save(); next();
}
function next(){ const r=V.run; r.i++; r.pick=null; r.shown=false; render(); window.scrollTo(0,0); }
function endRun(){ V.run.i=V.run.list.length; render(); }
function viewQuestion(){
  const r=V.run, q=r.list[r.i], n=r.list.length, u=unitOf(q.u), ui=UNITS.indexOf(u);
  const head = `<div class="qhead"><span>السؤال ${fmt(r.i+1)} من ${fmt(n)}</span><span>صحيح حتى الآن: ${fmt(r.right)}</span>
    <button class="btn btn-o btn-s" onclick="endRun()">إنهاء</button></div>
    <div class="qprog"><i style="width:${(r.i)/n*100}%"></i></div>`;
  const tag = `<span class="tag">الوحدة ${ORD[ui]} · ${TYPE_NAME[q.type]}</span>`;
  if(q.type==="essay"){
    return `<div class="quiz">${head}<div class="qcard">${tag}<div class="qtext">${esc(q.q)}</div>
      ${r.shown?`<div class="fb ess stamp"><b>الإجابة النموذجية:</b><br>${esc(q.a)}</div>
        <div class="qfoot"><span class="hint" style="margin:0">قارن إجابتك بالنموذج، ثم قيّم نفسك.</span>
        <div class="row"><button class="btn btn-p" onclick="selfGrade(true)">أجبتها صحيحاً</button><button class="btn btn-o" onclick="selfGrade(false)">احتاج مراجعة</button></div></div>`
      :`<p class="hint">فكّر في إجابتك أو اكتبها في دفترك، ثم اعرض الإجابة النموذجية.</p>
        <div class="qfoot"><span></span><button class="btn btn-g" onclick="reveal()">اعرض الإجابة</button></div>`}
    </div></div>`;
  }
  const done = r.pick!==null, right = done && r.pick===q.correct;
  const opts = q.options.map((o,i)=>{
    let c=""; if(done){ if(i===q.correct) c="ok"; else if(i===r.pick) c="bad"; }
    return `<button class="opt ${c}" ${done?"disabled":""} onclick="answer(${i})"><b>${LBL[i]}</b><span>${esc(o)}</span></button>`;
  }).join("");
  const fb = done ? `<div class="fb ${right?'ok':'bad'} stamp"><b>${right?"إجابة صحيحة.":"إجابة غير صحيحة. الصحيح: "+esc(q.options[q.correct])}</b>${q.why?`<br>${esc(q.why)}`:""}</div>` : "";
  return `<div class="quiz">${head}<div class="qcard">${tag}<div class="qtext">${esc(q.q)}</div>
    <div class="opts">${opts}</div>${fb}
    ${done?`<div class="qfoot"><span></span><button class="btn btn-p" onclick="next()" id="nextBtn">${r.i+1<n?"السؤال التالي":"عرض النتيجة"}</button></div>`:""}
  </div></div>`;
}
function viewResult(){
  const r=V.run, answered=Math.min(r.i,r.list.length), pct=answered?Math.round(r.right/answered*100):0;
  const msg = pct>=90?"مستوى ممتاز، استمر.":pct>=70?"أداء جيد. راجع الأسئلة التي أخطأت فيها.":"راجع دروس هذه الوحدات ثم أعد المحاولة، وابدأ بأخطائك.";
  return `<div class="quiz"><div class="qcard result">
    <div class="big">${fmt(pct)}٪</div>
    <h2 style="margin-top:10px">${fmt(r.right)} صحيحة من ${fmt(answered)}</h2>
    <p>${msg}</p>
    <div class="row" style="justify-content:center;margin-top:14px">
      ${r.wrongKeys.length?`<button class="btn btn-g" onclick="startPractice(V.run.wrongKeys)">أعد أخطاء هذه الجولة (${fmt(r.wrongKeys.length)})</button>`:""}
      <button class="btn btn-p" onclick="startPractice()">جولة جديدة</button>
      <button class="btn btn-o" onclick="V.run=null;render()">تغيير الإعدادات</button>
    </div></div></div>`;
}
function viewPractice(){
  if(!V.run) return viewPracticeSetup();
  if(V.run.i>=V.run.list.length) return viewResult();
  return viewQuestion();
}

/* ---------- الألعاب ---------- */

  return `<div class="sec-h"><div><h2>ألعاب الوحدات</h2><p class="lead">عشرون لعبة، أربع لكل وحدة: تصنيف سريع، ومسائل حسابية بأرقام جديدة في كل مرة، ووضع للفرق داخل القاعة.</p></div></div>
  <div class="games">${UNITS.map((u,i)=>`<div class="gcard">
      <div class="u-s">الوحدة ${ORD[i]}</div><h3>${esc(u.subtitle)}</h3>
      <ul>${GAMES[u.id].map(g=>`<li>${esc(g)}</li>`).join("")}</ul>
      <button class="btn btn-p" onclick="GM.open({unit:'${u.id}'})">افتح ألعاب الوحدة</button></div>`).join("")}
    <div class="gcard mix"><h3>تحدٍّ شامل</h3><p>أسئلة عشوائية من ألعاب الوحدات الخمس. اختره من قائمة الألعاب بعد فتحها.</p>
      <button class="btn btn-g" onclick="GM.open()">افتح قائمة الألعاب</button></div>
  </div>`;
}

/* ---------- أخطائي ---------- */
function viewWrong(){
  const keys = Object.keys(ST.wrong).filter(k=>BYKEY[k]);
  if(!keys.length) return `<div class="sec-h"><div><h2>أخطائي</h2></div></div>
    <div class="empty">لا توجد أخطاء محفوظة. كل سؤال تخطئ فيه أثناء التدريب يُسجَّل هنا حتى تجيب عنه صحيحاً.
      <div style="margin-top:14px"><button class="btn btn-p" onclick="go('practice')">ابدأ التدريب</button></div></div>`;
  const list = keys.map(k=>BYKEY[k]);
  return `<div class="sec-h"><div><h2>أخطائي</h2><p class="lead">${fmt(keys.length)} سؤالاً أخطأت فيها ولم تصحّحها بعد. يُحذف السؤال من هنا عندما تجيب عنه صحيحاً.</p></div>
    <div class="row"><button class="btn btn-g" onclick="startPractice(shuffle(Object.keys(ST.wrong).filter(k=>BYKEY[k])))">تدرّب على أخطائي</button>
    <button class="btn btn-o" onclick="if(confirm('مسح قائمة الأخطاء؟')){ST.wrong={};save();render();}">مسح القائمة</button></div></div>
  <div class="panel"><div class="sheet">${list.map((q,i)=>qHtml(q,i+1,true)).join("")}</div></div>`;
}

/* ---------- الطباعة والتصدير ---------- */
function exUnit(k){ V.ex.units[k]=!V.ex.units[k]; render(); }
function exType(k){ V.ex.types[k]=!V.ex.types[k]; render(); }
function exField(k){ V.ex.fields[k]=!V.ex.fields[k]; render(); }
function exSet(k,v){ V.ex[k]=v; render(); }
let EX_CACHE=null, EX_SIG="";
function exList(){
  const sig = JSON.stringify([V.ex.units,V.ex.types,V.ex.shuffle,V.ex.count]);
  if(sig===EX_SIG && EX_CACHE) return EX_CACHE;
  const out = {};
  TYPES.forEach(t=>{
    if(!V.ex.types[t.k]) return;
    let qs = ALL.filter(q=>q.type===t.k && V.ex.units[q.u]);
    if(V.ex.shuffle) qs = shuffle(qs).map(prepare);
    if(V.ex.count) qs = qs.slice(0, V.ex.count);
    if(qs.length) out[t.k]=qs;
  });
  EX_SIG=sig; EX_CACHE=out; return out;
}
function reshuffle(){ EX_SIG=""; render(); }
function qHtml(q,n,solved){
  if(q.type==="essay") return `<div class="qq"><div class="t">${n}. ${esc(q.q)}</div>
    ${solved?`<div class="why ok">${esc(q.a)}</div>`:`<div class="lines"><div></div><div></div><div></div></div>`}</div>`;
  if(q.type==="tf") return `<div class="qq"><div class="t">${n}. ${esc(q.q)} ${solved?`<span class="ok">(${q.correct===0?"صح":"خطأ"})</span>`:`<span style="font-weight:400;color:#555">(&nbsp;&nbsp;&nbsp;&nbsp;)</span>`}</div>
    ${solved&&q.why?`<div class="why">${esc(q.why)}</div>`:""}</div>`;
  return `<div class="qq"><div class="t">${n}. ${esc(q.q)}</div>
    <div class="oo">${q.options.map((o,i)=>`<div${solved&&i===q.correct?' class="ok"':''}>${LBL[i]}. ${esc(o)}${solved&&i===q.correct?" ✓":""}</div>`).join("")}</div>
    ${solved&&q.why?`<div class="why">التعليل: ${esc(q.why)}</div>`:""}</div>`;
}
const SEC_TITLE = {mcq:"أولاً: اختر الإجابة الصحيحة", tf:"ضع كلمة (صح) أو (خطأ) أمام كل عبارة", game:"أسئلة من ألعاب الوحدات: اختر الإجابة الصحيحة", essay:"أجب عن الأسئلة التالية"};
function sheetHtml(solved){
  const L = exList(), ks = Object.keys(L);
  const ordW = ["أولاً","ثانياً","ثالثاً","رابعاً"];
  const unitsSel = UNITS.filter(u=>V.ex.units[u.id]);
  const scope = unitsSel.length===UNITS.length ? "المقرر كاملاً" : unitsSel.map(u=>"الوحدة "+ORD[UNITS.indexOf(u)]).join("، ");
  const F = [["name","اسم المتدرب"],["section","الشعبة"],["date","التاريخ"]].filter(f=>V.ex.fields[f[0]]);
  let total=0;
  const body = ks.map((k,si)=>{
    const t = SEC_TITLE[k].replace(/^أولاً: /,"");
    return `<h2>${ordW[si]}: ${t} (${L[k].length})</h2>` + L[k].map((q,i)=>{ total++; return qHtml(q,i+1,solved); }).join("");
  }).join("");
  let key="";
  if(solved){
    key = ks.filter(k=>k!=="essay").map((k,si)=>`<div><b>${ordW[ks.indexOf(k)]}:</b> ${L[k].map((q,i)=>`${i+1}-${k==="tf"?(q.correct===0?"صح":"خطأ"):LBL[q.correct]}`).join(" · ")}</div>`).join("");
    if(key) key=`<div class="key"><b>مفتاح الإجابات</b>${key}</div>`;
  }
  return `<div class="sheet">
    <div class="hd"><h1>${esc(V.ex.title||"أسئلة مراجعة")}</h1>
      <div>${esc(D.settings.title)}${D.settings.code?" ("+esc(D.settings.code)+")":""} · ${esc(scope)} · ${solved?"نسخة محلولة":"نسخة غير محلولة"}</div></div>
    ${F.length?`<div class="info">${F.map(f=>`<span>${f[1]}: ..............................</span>`).join("")}</div>`:""}
    ${body}${key}</div>`;
}
function exCount(){ return Object.values(exList()).reduce((a,x)=>a+x.length,0); }
function viewExport(){
  const n = exCount();
  const cnts=[0,10,20,30];
  return `<div class="sec-h"><div><h2>الطباعة والتصدير</h2><p class="lead">كوّن ورقة مراجعة من بنك الأسئلة، ثم اطبعها أو احفظها PDF أو نزّلها ملف Word.</p></div></div>
  <div class="grid2">
    <div class="panel">
      <div class="lbl">عنوان الورقة</div>
      <input class="inp" value="${esc(V.ex.title)}" oninput="V.ex.title=this.value" onchange="render()">
      <div class="lbl">الوحدات</div>
      <div class="row">${chips(V.ex.units,"exUnit",UNITS.map((u,i)=>[u.id,"الوحدة "+ORD[i]]))}</div>
      <div class="lbl">أنواع الأسئلة</div>
      <div class="row">${chips(V.ex.types,"exType",TYPES.map(t=>[t.k,t.n,ALL.filter(q=>q.type===t.k&&V.ex.units[q.u]).length]))}</div>
      <div class="lbl">عدد الأسئلة من كل نوع</div>
      <div class="row">${cnts.map(c=>`<button class="chip ${V.ex.count===c?'on':''}" onclick="exSet('count',${c})">${c?fmt(c):"الكل"}</button>`).join("")}</div>
      <div class="lbl">ترتيب الأسئلة والخيارات</div>
      <div class="row"><button class="chip ${V.ex.shuffle?'on':''}" onclick="exSet('shuffle',true)">عشوائي</button>
        <button class="chip ${!V.ex.shuffle?'on':''}" onclick="exSet('shuffle',false)">كما في البنك</button>
        ${V.ex.shuffle?`<button class="btn btn-o btn-s" onclick="reshuffle()">خلط من جديد</button>`:""}</div>
      <div class="lbl">النسخة</div>
      <div class="row"><button class="chip ${!V.ex.solved?'on':''}" onclick="exSet('solved',false)">غير محلولة</button>
        <button class="chip ${V.ex.solved?'on':''}" onclick="exSet('solved',true)">محلولة مع التعليل</button></div>
      <div class="lbl">بيانات في رأس الورقة</div>
      <div class="row">${chips(V.ex.fields,"exField",[["name","اسم المتدرب"],["section","الشعبة"],["date","التاريخ"]])}</div>
      <div class="row" style="margin-top:24px">
        <button class="btn btn-p" onclick="doPrint()" ${n?"":"disabled"}>طباعة</button>
        <button class="btn btn-p" onclick="doPrint(true)" ${n?"":"disabled"}>حفظ PDF</button>
        <button class="btn btn-g" onclick="doWord()" ${n?"":"disabled"}>تنزيل Word</button>
      </div>
      <p class="hint">«حفظ PDF» يفتح نافذة الطباعة: اختر فيها الوجهة «حفظ بتنسيق PDF». الورقة الحالية تضم ${fmt(n)} سؤالاً.</p>
    </div>
    <div>${n?`<div class="paper">${sheetHtml(V.ex.solved)}</div>`:`<div class="empty">اختر وحدة واحدة ونوع أسئلة واحداً على الأقل لتظهر معاينة الورقة.</div>`}</div>
  </div>`;
}
function doPrint(pdf){
  const p=document.getElementById("print"); p.innerHTML=sheetHtml(V.ex.solved);
  const old=document.title; if(pdf) document.title=(V.ex.title||"أسئلة مراجعة")+(V.ex.solved?" - محلولة":"");
  setTimeout(()=>{ window.print(); document.title=old; },60);
}
function doWord(){
  const html = `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${esc(V.ex.title)}</title>
  <style>body{font-family:'Tajawal','Arial',sans-serif;direction:rtl;font-size:14px;line-height:1.9}
  .hd{text-align:center;border-bottom:2px solid #0E6B57;padding-bottom:8px;margin-bottom:12px}
  .hd h1{font-size:20px;color:#0E6B57;margin:0}.hd div{font-size:12px;color:#444}
  .info span{margin-left:30px}h2{font-size:15px;color:#0E6B57;border-bottom:1px solid #ccc;margin:16px 0 6px}
  .qq{margin-bottom:10px}.t{font-weight:bold}.oo div{padding-right:18px}.ok{color:#0B7A55;font-weight:bold}
  .why{font-size:12px;color:#445;padding-right:18px}.lines div{border-bottom:1px dotted #999;height:22px}
  .key{margin-top:14px;border-top:2px solid #0E6B57;padding-top:6px;font-size:12px}</style></head>
  <body>${sheetHtml(V.ex.solved)}</body></html>`;
  const blob = new Blob(["\ufeff",html],{type:"application/msword"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=(V.ex.title||"أسئلة مراجعة")+(V.ex.solved?" - محلولة":"")+".doc";
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}

/* ---------- العرض ---------- */
function render(){
  renderNav();
  const app=document.getElementById("app");
  app.innerHTML = V.view==="home"?viewHome():V.view==="practice"?viewPractice():V.view==="games"?viewGames():V.view==="export"?viewExport():viewWrong();
  const nb=document.getElementById("nextBtn"); if(nb) nb.focus({preventScroll:true});
}
document.addEventListener("keydown",e=>{
  if(document.getElementById("gmOverlay")) return;
  if(V.view!=="practice"||!V.run||V.run.i>=V.run.list.length) return;
  const q=V.run.list[V.run.i]; if(q.type==="essay") return;
  const n="١٢٣٤٥٦".indexOf(e.key)>=0?"١٢٣٤٥٦".indexOf(e.key):parseInt(e.key,10)-1;
  if(V.run.pick===null && n>=0 && n<q.options.length){ e.preventDefault(); answer(n); }
});
render();

</script>
</body>
</html>
