:root{
  --paper:#F5F7F2; --sheet:#FFFFFF; --ink:#16223A; --ink2:#46536B; --mute:#7A869A;
  --ledger:#0E6B57; --ledger-d:#0A4E40; --ledger-l:#E3F1EC;
  --rule:#D5E3E8; --margin:#C8483B; --gold:#C98A12; --gold-l:#FBF1DA;
  --ok:#11845F; --ok-l:#E4F5EE; --bad:#B8392D; --bad-l:#FBE9E6;
  --r-s:6px; --r-m:12px;
}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Tajawal',system-ui,'Segoe UI',Tahoma,sans-serif;
  font-size:16px;line-height:1.85;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
input,select{font-family:inherit;font-size:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* شريط علوي */
.top{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;font-weight:900;font-size:19px;line-height:1.35}
.brand .b1{color:#FFFFFF}
.brand .b2{font-size:14px;font-weight:800;color:#F2C35B}
.brand .b3{font-size:13px;font-weight:600;color:#7FD6BE}
.brand .b4{font-size:12.5px;font-weight:600;color:#F3A99F}
.brand small{font-weight:500;font-size:13px;color:#AFC0D6}
.nav{display:flex;gap:4px;margin-inline-start:auto;flex-wrap:wrap}
.nav button{background:none;border:0;color:#D7E1EE;padding:7px 13px;border-radius:var(--r-s);font-weight:700;font-size:15px}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button.on{background:#fff;color:var(--ink)}
.nav .cnt{display:inline-block;min-width:20px;padding:0 6px;margin-inline-start:4px;border-radius:10px;background:var(--margin);color:#fff;font-size:12px;line-height:20px;text-align:center}

main{max-width:1120px;margin:0 auto;padding:28px 20px 70px}
h1,h2,h3{margin:0;line-height:1.35}
.lead{color:var(--ink2);max-width:62ch;margin:8px 0 0}

/* الصفحة الرئيسية: ورقة دفتر أستاذ */
.hero{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:26px}
.hero h1{font-size:clamp(30px,5vw,46px);font-weight:900;letter-spacing:-.5px}
.ledger{position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-m);overflow:hidden;
  box-shadow:0 1px 0 var(--rule),0 12px 30px -18px rgba(22,34,58,.35)}
.ledger::before{content:"";position:absolute;inset-block:0;inset-inline-start:58px;border-inline-start:2px solid var(--margin);
  box-shadow:4px 0 0 -2px var(--margin);pointer-events:none;opacity:.55}
.ledger-scroll{overflow-x:auto}
table.lg{width:100%;border-collapse:collapse;min-width:760px}
table.lg th{font-size:13px;font-weight:800;color:var(--mute);text-align:right;padding:14px 14px 10px;border-bottom:2px solid var(--ink)}
table.lg td{padding:14px;border-bottom:1px solid var(--rule);vertical-align:middle}
table.lg td.no{width:58px;text-align:center;font-weight:900;font-size:22px;color:var(--ledger)}
.u-t{font-weight:800;font-size:16.5px}
.u-s{font-size:13.5px;color:var(--mute)}
.num{font-variant-numeric:tabular-nums;font-weight:800;text-align:center}
.bar{height:8px;border-radius:4px;background:var(--ledger-l);overflow:hidden;min-width:110px}
.bar i{display:block;height:100%;background:var(--ledger);border-radius:4px;transition:width .5s}
.pct{font-size:12.5px;color:var(--mute);margin-top:3px}
tr.total td{font-weight:900;border-bottom:0;padding-top:12px}
tr.total td.sum{border-top:1px solid var(--ink);border-bottom:4px double var(--ink)}
.acts{display:flex;gap:6px;justify-content:flex-end}

/* أزرار */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid transparent;border-radius:var(--r-s);
  padding:8px 16px;font-weight:800;font-size:15px;transition:background .15s,border-color .15s;text-decoration:none;white-space:nowrap}
.btn-p{background:var(--ledger);color:#fff}.btn-p:hover{background:var(--ledger-d)}
.btn-o{background:#fff;border-color:var(--rule);color:var(--ink)}.btn-o:hover{border-color:var(--ledger);color:var(--ledger)}
.btn-g{background:var(--gold);color:#fff}.btn-g:hover{background:#A87209}
.btn-s{padding:5px 11px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* بطاقات إعداد */
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-m);padding:22px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lbl{font-weight:800;font-size:14px;color:var(--ink2);margin:18px 0 8px}
.lbl:first-child{margin-top:0}
.chip{border:2px solid var(--rule);background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14.5px;color:var(--ink2)}
.chip.on{border-color:var(--ledger);background:var(--ledger-l);color:var(--ledger-d)}
.chip small{color:var(--mute);font-weight:600}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.sec-h h2{font-size:28px;font-weight:900}

/* بطاقة السؤال */
.quiz{max-width:760px;margin:0 auto}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute);margin-bottom:8px;gap:10px;flex-wrap:wrap}
.qprog{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-bottom:18px}
.qprog i{display:block;height:100%;background:var(--gold);transition:width .3s}
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-m);padding:26px 26px 22px;position:relative}
.qcard .tag{display:inline-block;font-size:12.5px;font-weight:800;color:var(--ledger);background:var(--ledger-l);border-radius:4px;padding:1px 8px;margin-bottom:10px}
.qtext{font-size:19px;font-weight:800;line-height:1.9;margin-bottom:18px}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:right;width:100%;background:#fff;border:2px solid var(--rule);border-radius:var(--r-s);
  padding:11px 14px;font-size:16px;font-weight:600;line-height:1.7}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--paper);font-size:14px;color:var(--ink2)}
.opt:hover:not(:disabled){border-color:var(--ledger)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-l)}.opt.ok b{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-l)}.opt.bad b{background:var(--bad);color:#fff}
.fb{margin-top:16px;padding:13px 16px;border-radius:var(--r-s);font-size:15px;border-inline-start:4px solid}
.fb.ok{background:var(--ok-l);border-color:var(--ok)}.fb.bad{background:var(--bad-l);border-color:var(--bad)}
.fb.ess{background:var(--gold-l);border-color:var(--gold)}
.qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px;flex-wrap:wrap}
.stamp{animation:stamp .35s ease-out}
@keyframes stamp{from{transform:scale(1.04)}to{transform:none}}

/* النتيجة */
.result{text-align:center;padding:36px 20px}
.result .big{font-size:64px;font-weight:900;color:var(--ledger);line-height:1}
.result p{color:var(--ink2)}

/* ألعاب */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.gcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-m);padding:20px;display:flex;flex-direction:column;gap:10px}
.gcard h3{font-size:18px}
.gcard ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.gcard li{font-size:14.5px;color:var(--ink2);padding:4px 0;border-bottom:1px dashed var(--rule)}
.gcard .btn{margin-top:auto}
.gcard.mix{background:var(--ink);color:#fff;border-color:var(--ink)}
.gcard.mix p{color:#C7D3E3;margin:0}

/* معاينة الورقة */
.paper{background:#fff;border:1px solid var(--rule);border-radius:4px;padding:34px 38px;box-shadow:0 18px 40px -26px rgba(22,34,58,.45);
  max-height:640px;overflow:auto}
.inp{border:2px solid var(--rule);border-radius:var(--r-s);padding:7px 10px;background:#fff;width:100%;max-width:300px}
.hint{font-size:13.5px;color:var(--mute);margin-top:8px}
.empty{padding:40px 20px;text-align:center;color:var(--ink2);border:2px dashed var(--rule);border-radius:var(--r-m);background:var(--sheet)}

/* ورقة الأسئلة (معاينة وطباعة) */
.sheet{font-family:'Tajawal',Arial,sans-serif;color:#000;direction:rtl;font-size:14px;line-height:1.9}
.sheet .hd{text-align:center;border-bottom:2px solid #0E6B57;padding-bottom:10px;margin-bottom:12px}
.sheet .hd h1{font-size:20px;color:#0E6B57;margin:0 0 2px}
.sheet .hd div{font-size:12.5px;color:#444}
.sheet .info{display:flex;flex-wrap:wrap;gap:8px 30px;font-size:13px;border-bottom:1px dashed #888;padding-bottom:8px;margin-bottom:12px}
.sheet h2{font-size:15px;color:#0E6B57;margin:18px 0 8px;border-bottom:1px solid #ccc;padding-bottom:3px}
.sheet .qq{margin-bottom:11px;break-inside:avoid;page-break-inside:avoid}
.sheet .qq .t{font-weight:700}
.sheet .oo{display:grid;grid-template-columns:1fr 1fr;gap:1px 24px;padding-inline-start:18px}
.sheet .ok{color:#0B7A55;font-weight:700}
.sheet .why{font-size:12.5px;color:#445;padding-inline-start:18px}
.sheet .lines div{border-bottom:1px dotted #999;height:22px;margin:0 18px}
.sheet .key{margin-top:16px;padding-top:8px;border-top:2px solid #0E6B57;font-size:12.5px}
#print{display:none}
@media print{
  @page{margin:14mm}
  body{background:#fff}
  body > *:not(#print){display:none!important}
  #print{display:block}
  .sheet .oo{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  .top{position:static}
  .top-in{justify-content:center;gap:10px}
  .nav{margin-inline-start:0;justify-content:center}
  main{padding:20px 14px 60px}
  .qcard{padding:20px 16px}
  .qtext{font-size:17px}
  .sheet .oo{grid-template-columns:1fr}
  .paper{padding:20px 16px}
}
/* ============================================================
   لعبة سلوك التكاليف — الأنماط
   كل الأصناف تبدأ بـ gm- حتى لا تتعارض مع أنماط التطبيق
   ============================================================ */
.gm{
  --g-ink:#0f172a; --g-soft:#475569; --g-muted:#64748b;
  --g-bg:#f4f8f6; --g-card:#fff; --g-br:#e2e8f0;
  --g-em:#059669; --g-em7:#047857; --g-em9:#064e3b; --g-em50:#ecfdf5; --g-em100:#d1fae5;
  --g-blue:#1d4ed8; --g-blue50:#eff6ff; --g-blue-br:#bfdbfe;
  --g-amber:#b45309; --g-amber50:#fffbeb; --g-amber-br:#fde68a;
  --g-red:#b91c1c; --g-red50:#fef2f2; --g-red-br:#fca5a5;
  --g-purple:#6d28d9; --g-purple50:#f5f3ff;
  --g-scale:1;
  position:fixed; inset:0; z-index:900; overflow-y:auto;
  background:var(--g-bg); color:var(--g-ink); direction:rtl;
  font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:calc(15px * var(--g-scale)); line-height:1.8;
}
.gm.big{ --g-scale:1.28; }
.gm *,.gm *::before,.gm *::after{box-sizing:border-box}
/* ملاحظة: لا نضبط هنا border/background/color لأن ".gm button" أقوى تخصيصاً من أصناف
   الأزرار نفسها (.gm-opt وغيرها) فكان يلغي حدودها وألوانها. كل زر يعرّف مظهره بنفسه. */
.gm button{font-family:inherit;font-size:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
.gm input{font-family:inherit;font-size:inherit;color:inherit}
.gm h1,.gm h2,.gm h3{margin:0;line-height:1.4;font-weight:900}

.gm-wrap{max-width:1000px;margin:0 auto;padding:18px 18px 60px}
.gm-top{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 0 14px;border-bottom:1px solid var(--g-br);margin-bottom:18px;flex-wrap:wrap}
.gm-brand{display:flex;align-items:center;gap:10px;font-weight:900;color:var(--g-em9);font-size:1.05em}
.gm-brand .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--g-em7),var(--g-em9));color:#fff;font-size:1.1em}
.gm-top .sp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.gm-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:.6em 1.1em;border-radius:11px;font-weight:800;font-size:.92em;transition:.15s;border:1px solid transparent}
.gm-btn.p{background:var(--g-em);color:#fff}
.gm-btn.p:hover{background:var(--g-em7)}
.gm-btn.o{background:#fff;color:var(--g-em9);border-color:var(--g-br)}
.gm-btn.o:hover{background:var(--g-em50);border-color:var(--g-em100)}
.gm-btn.g{background:transparent;color:var(--g-soft);border-color:var(--g-br)}
.gm-btn.g:hover{background:#eef2f6}
.gm-btn:disabled{opacity:.45;cursor:not-allowed}
.gm-btn.sm{padding:.35em .8em;font-size:.82em;border-radius:9px}

.gm-card{background:var(--g-card);border:1px solid var(--g-br);border-radius:16px;padding:18px;
  box-shadow:0 1px 2px rgba(15,23,42,.05)}
.gm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}

/* ---- شاشة البداية ---- */
.gm-hero{background:linear-gradient(140deg,#0b5c45,#08402f);color:#fff;border-radius:20px;padding:26px 24px;margin-bottom:18px}
.gm-hero h1{font-size:1.75em;margin-bottom:8px}
.gm-hero p{margin:0;color:#bfe9d8;font-size:.95em;line-height:1.9;max-width:58ch}
.gm-modes{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.gm-mode{padding:.55em 1.15em;border-radius:999px;font-weight:800;font-size:.88em;transition:.15s;
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);color:#ecfdf5}
.gm-mode:hover{background:rgba(255,255,255,.24)}
.gm-mode.on{background:#fff;color:var(--g-em9);border-color:#fff}

.gm-pick{background:var(--g-card);border:1px solid var(--g-br);border-radius:16px;padding:18px;
  display:flex;flex-direction:column;gap:9px;transition:.18s;text-align:right;position:relative;overflow:hidden}
.gm-pick:hover{border-color:var(--g-em100);box-shadow:0 8px 24px rgba(15,23,42,.09);transform:translateY(-2px)}
.gm-pick .em{font-size:1.7em;line-height:1}
.gm-pick h3{font-size:1.05em;color:var(--g-em9)}
.gm-pick p{margin:0;font-size:.85em;color:var(--g-muted);line-height:1.8}
.gm-pick .best{font-size:.78em;color:var(--g-em7);font-weight:800}
.gm-pick .tag{position:absolute;inset-inline-end:14px;top:14px;font-size:.72em;font-weight:800;
  padding:2px 9px;border-radius:999px;background:var(--g-em50);color:var(--g-em7);border:1px solid var(--g-em100)}

/* ---- شريط الحالة أثناء اللعب ---- */
.gm-hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.gm-stat{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--g-br);
  border-radius:11px;padding:.45em .85em;font-size:.85em;font-weight:800;color:var(--g-soft)}
.gm-stat b{color:var(--g-em9);font-size:1.1em}
.gm-stat.warn b{color:var(--g-red)}
.gm-timer{flex:1 1 160px;min-width:120px;height:8px;border-radius:999px;background:#e2e8f0;overflow:hidden}
.gm-timer i{display:block;height:100%;background:var(--g-em);transition:width .25s linear}
.gm-timer.low i{background:#dc2626}
.gm-lives{letter-spacing:2px;font-size:1em}

/* ---- لعبة الفرز ---- */
.gm-item{background:#fff;border:2px solid var(--g-br);border-radius:18px;padding:30px 24px;text-align:center;
  min-height:150px;display:grid;place-items:center;font-size:1.25em;font-weight:800;color:var(--g-ink);line-height:1.7}
.gm-item.ok{border-color:var(--g-em);background:var(--g-em50)}
.gm-item.no{border-color:var(--g-red-br);background:var(--g-red50)}
.gm-sortbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:14px}
.gm-sortbtns button{padding:1em .6em;border-radius:14px;font-weight:900;font-size:1em;border:2px solid #cbd5e1;
  background:#fff;color:var(--g-ink);transition:.14s;line-height:1.5}
.gm-sortbtns button:disabled{color:var(--g-muted)}
.gm-sortbtns button span{display:block;font-size:.72em;font-weight:600;color:var(--g-muted);margin-top:2px}
.gm-sortbtns button:hover:not(:disabled){border-color:var(--g-em);background:var(--g-em50)}
.gm-sortbtns button.sb-f,.gm-sortbtns button.fn-p{border-color:#c7d2fe}
.gm-sortbtns button.sb-f:hover:not(:disabled),.gm-sortbtns button.fn-p:hover:not(:disabled){background:#eef2ff;border-color:#6366f1}
.gm-sortbtns button.sb-v,.gm-sortbtns button.fn-s{border-color:#fbcfe8}
.gm-sortbtns button.sb-v:hover:not(:disabled),.gm-sortbtns button.fn-s:hover:not(:disabled){background:#fdf2f8;border-color:#db2777}
.gm-sortbtns button.sb-m,.gm-sortbtns button.fn-a{border-color:#fde68a}
.gm-sortbtns button.sb-m:hover:not(:disabled),.gm-sortbtns button.fn-a:hover:not(:disabled){background:#fffbeb;border-color:#d97706}
.gm-sortbtns button.right{background:var(--g-em50);border-color:var(--g-em);color:var(--g-em9)}
.gm-sortbtns button.wrong{background:var(--g-red50);border-color:var(--g-red-br);color:var(--g-red)}

.gm-fb{margin-top:13px;border-radius:13px;padding:12px 15px;font-size:.9em;line-height:1.85;border:1px solid}
.gm-fb.ok{background:var(--g-em50);border-color:var(--g-em100);color:#134e4a}
.gm-fb.no{background:var(--g-red50);border-color:var(--g-red-br);color:var(--g-red)}
.gm-fb.info{background:var(--g-blue50);border-color:var(--g-blue-br);color:#1e3a8a}
.gm-fb b{font-weight:900}
.gm-combo{display:inline-block;background:var(--g-amber50);border:1px solid var(--g-amber-br);color:var(--g-amber);
  border-radius:999px;padding:2px 11px;font-size:.8em;font-weight:900;margin-inline-start:8px}

/* ---- الخطوات (أعلى وأدنى) ---- */
.gm-steps{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.gm-step{flex:1 1 120px;text-align:center;padding:.5em;border-radius:10px;font-size:.8em;font-weight:800;
  background:#fff;border:1px solid var(--g-br);color:var(--g-muted)}
.gm-step.on{background:var(--g-em);border-color:var(--g-em);color:#fff}
.gm-step.done{background:var(--g-em50);border-color:var(--g-em100);color:var(--g-em7)}
.gm-tbl{width:100%;border-collapse:collapse;font-size:.92em;margin:12px 0}
.gm-tbl th{background:var(--g-em);color:#fff;padding:.6em .8em;text-align:center;font-weight:800}
.gm-tbl td{padding:.55em .8em;border-bottom:1px solid var(--g-br);text-align:center}
.gm-tbl tr:last-child td{border-bottom:0}
.gm-tbl tr.hi td{background:#dcfce7;font-weight:800}
.gm-tbl tr.lo td{background:#dbeafe;font-weight:800}
.gm-tbl tr.pick{cursor:pointer}
.gm-tbl tr.pick:hover td{background:var(--g-em50)}
.gm-tbl tr.sel td{background:#fef9c3;font-weight:800}
.gm-num{width:100%;max-width:230px;padding:.6em .9em;border:2px solid var(--g-br);border-radius:12px;
  font-size:1.05em;font-weight:800;text-align:center;direction:ltr;outline:none;transition:.14s}
.gm-num:focus{border-color:var(--g-em);box-shadow:0 0 0 3px var(--g-em50)}
.gm-eq{background:#0f172a;color:#a7f3d0;border-radius:12px;padding:12px 16px;text-align:center;
  font-weight:800;font-size:1.05em;margin:12px 0;direction:rtl}
.gm-hint{font-size:.85em;color:var(--g-muted);margin-top:7px;line-height:1.8}
.gm-work{background:#f8fafc;border:1px solid var(--g-br);border-radius:12px;padding:12px 15px;margin-top:11px;
  font-size:.88em;line-height:2;color:var(--g-soft)}
.gm-work b{color:var(--g-em7)}

/* ---- الرسوم ---- */
.gm-chart{background:#fff;border:1px solid var(--g-br);border-radius:14px;padding:10px;display:grid;place-items:center}
.gm-chart svg{width:100%;height:auto;max-width:520px;display:block}
.gm-chart.mini svg{max-width:210px}
.gm-chart.mini{cursor:pointer;transition:.15s;border-width:2px}
.gm-chart.mini:hover{border-color:var(--g-em);background:var(--g-em50)}
.gm-chart.mini.right{border-color:var(--g-em);background:var(--g-em50)}
.gm-chart.mini.wrong{border-color:var(--g-red-br);background:var(--g-red50)}
.gm-opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.gm-opt{width:100%;text-align:right;padding:.7em 1em;border-radius:12px;border:2px solid #cbd5e1;
  background:#fff;font-size:.95em;font-weight:700;color:var(--g-soft);transition:.14s;display:flex;gap:9px;align-items:flex-start}
.gm-opt:hover:not(:disabled){border-color:var(--g-em);background:var(--g-em50)}
.gm-opt .l{flex:0 0 auto;font-weight:900;color:var(--g-muted)}
.gm-opt.right{background:var(--g-em50);border-color:var(--g-em);color:var(--g-em9)}
.gm-opt.wrong{background:var(--g-red50);border-color:var(--g-red-br);color:var(--g-red)}
.gm-opt:disabled{cursor:default;color:var(--g-muted)}
.gm-opt.right:disabled{color:var(--g-em9)}
.gm-opt.wrong:disabled{color:var(--g-red)}

/* ---- الفرق ---- */
.gm-teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0}
.gm-team{background:#fff;border:2px solid var(--g-br);border-radius:14px;padding:12px;text-align:center;transition:.15s}
.gm-team.turn{border-color:var(--g-em);background:var(--g-em50);box-shadow:0 6px 18px rgba(5,150,105,.16)}
.gm-team .nm{font-weight:900;font-size:.95em;color:var(--g-ink)}
.gm-team .sc{font-size:1.6em;font-weight:900;color:var(--g-em7);line-height:1.3}
.gm-team .badge{font-size:.72em;font-weight:800;color:var(--g-em);display:block}
.gm-turnbar{background:var(--g-em9);color:#fff;border-radius:13px;padding:.7em 1.2em;text-align:center;
  font-weight:900;font-size:1.05em;margin-bottom:14px}

/* ---- النتائج ---- */
.gm-final{text-align:center;padding:12px 0}
.gm-final .big{font-size:3.2em;font-weight:900;color:var(--g-em7);line-height:1.2}
.gm-final .sub{color:var(--g-muted);font-size:.95em}
.gm-medal{font-size:3em;line-height:1}
.gm-bars{margin-top:16px;text-align:right}
.gm-bar{margin-bottom:9px}
.gm-bar .lb{display:flex;justify-content:space-between;font-size:.85em;font-weight:700;color:var(--g-soft);margin-bottom:3px}
.gm-bar .tr{height:9px;border-radius:999px;background:#e2e8f0;overflow:hidden}
.gm-bar .tr i{display:block;height:100%;background:var(--g-em);border-radius:999px}
.gm-bar.low .tr i{background:#dc2626}
.gm-bar.mid .tr i{background:#d97706}
.gm-review{margin-top:16px;text-align:right}
.gm-review .it{border-top:1px solid var(--g-br);padding:10px 0;font-size:.88em;line-height:1.85}
.gm-review .it:first-child{border-top:0}
.gm-review .it b{color:var(--g-red)}

.gm-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:640px){
  .gm-wrap{padding:14px 13px 70px}
  .gm-hero{padding:20px 17px}
  .gm-hero h1{font-size:1.4em}
  .gm-sortbtns{grid-template-columns:1fr}
  .gm-item{font-size:1.1em;padding:22px 16px;min-height:120px}
  .gm.big{--g-scale:1.06}
}


/* ---- أصناف مضافة للنسخة متعددة الوحدات ---- */
.gm-h{font-size:1.1em;margin:6px 0 12px;font-weight:900;color:var(--g-ink)}
.gm-q{font-size:1.03em;line-height:1.9;margin:0 0 13px;font-weight:800;color:var(--g-ink)}
.gm-actions{margin-top:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gm-actions.gm-center{justify-content:center}
.gm-center{text-align:center}
.gm-lbl{font-size:.85em;color:var(--g-muted)}
.gm-sub2{margin-top:10px;font-size:.9em;color:var(--g-muted)}
.gm-win{font-size:1.5em;margin:6px 0}
.gm-tname{max-width:100%;font-size:.9em;padding:.45em .6em}
.gm-count{font-size:.78em;font-weight:800;color:var(--g-em7)}
.gm-back{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.gm-unitname{font-size:.9em;font-weight:800;color:var(--g-em9)}
.gm-pick.mix{background:linear-gradient(150deg,#f5f3ff,#ede9fe);border-color:#ddd6fe}
.gm-pick.mix h3{color:#5b21b6}
.gm-pick.mix:hover{border-color:#a78bfa}
.gm-item-sm{min-height:96px;font-size:1.12em}
.gm-review .wy{color:var(--g-muted)}

/* مصفوفة التبويب 3×2 */
.gm-matrix{display:grid;grid-template-columns:auto 1fr 1fr;gap:9px;margin-top:14px;align-items:stretch}
.gm-mh{display:grid;place-items:center;font-size:.85em;font-weight:900;color:var(--g-em9);padding:4px}
.gm-mr{display:grid;place-items:center;font-size:.95em;font-weight:900;color:var(--g-ink);
  background:#f1f5f9;border-radius:11px;padding:6px 12px;min-width:74px}
.gm-cell{padding:1em .7em;border-radius:13px;border:2px solid #cbd5e1;background:#fff;color:var(--g-ink);
  font-weight:800;font-size:.95em;transition:.14s;line-height:1.5}
.gm-cell:disabled{color:var(--g-muted)}
.gm-cell:hover:not(:disabled){border-color:var(--g-em);background:var(--g-em50)}
.gm-cell.c-mat{border-color:#bfdbfe} .gm-cell.c-mat:hover:not(:disabled){background:#eff6ff;border-color:#3b82f6}
.gm-cell.c-lab{border-color:#fbcfe8} .gm-cell.c-lab:hover:not(:disabled){background:#fdf2f8;border-color:#db2777}
.gm-cell.c-srv{border-color:#fde68a} .gm-cell.c-srv:hover:not(:disabled){background:#fffbeb;border-color:#d97706}
.gm-cell.right{background:var(--g-em50);border-color:var(--g-em);color:var(--g-em9)}
.gm-cell.wrong{background:var(--g-red50);border-color:var(--g-red-br);color:var(--g-red)}

/* ترتيب بنود القائمة */
.gm-order{display:flex;flex-direction:column;gap:6px;margin:12px 0;min-height:60px}
.gm-oline{display:flex;align-items:center;gap:9px;background:#fff;border:2px solid var(--g-br);
  border-radius:11px;padding:.55em .9em;font-size:.93em;font-weight:700}
.gm-oline.right{border-color:var(--g-em);background:var(--g-em50)}
.gm-oline.wrong{border-color:var(--g-red-br);background:var(--g-red50)}
.gm-oline .nn{flex:0 0 auto;width:24px;height:24px;border-radius:8px;background:var(--g-em);color:#fff;
  display:grid;place-items:center;font-size:.8em;font-weight:900}
.gm-empty{color:var(--g-muted);font-size:.88em;padding:14px;text-align:center;
  border:2px dashed var(--g-br);border-radius:12px}
.gm-pool{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.gm-chipbtn{padding:.5em .9em;border-radius:999px;border:2px solid #cbd5e1;background:#fff;
  font-size:.88em;font-weight:700;color:var(--g-soft);transition:.14s}
.gm-chipbtn:disabled{opacity:.5}
.gm-chipbtn:hover:not(:disabled){border-color:var(--g-em);background:var(--g-em50);color:var(--g-em9)}
@media (max-width:640px){
  .gm-matrix{grid-template-columns:auto 1fr 1fr;gap:6px}
  .gm-cell{font-size:.82em;padding:.8em .4em}
  .gm-mr{font-size:.85em;padding:4px 7px;min-width:56px}
}

ه الاختلاف بين محاسبة التكاليف والمحاسبة المالية:","options":["محاسبة التكاليف تهتم بالبيانات الإجمالية، بينما المالية تهتم بالتفصيلية","محاسبة التكاليف تقاريرها إلزامية، بينما المالية اختيارية","محاسبة التكاليف تتعامل مع البيانات التاريخية والمستقبلية، بينما المالية تركز على التاريخية","محاسبة التكاليف تخضع لمعايير محاسبية متفق عليها، بينما المالية لا تخضع"],"correct":2},{"q":"أي من التالي يعتبر مستخدماً رئيسياً لتقارير محاسبة التكاليف؟","options":["المستثمرون والدائنون","الجهات الحكومية","جميع المستويات الإدارية داخل المنشأة","ملاك المنشأة فقط"],"correct":2},{"q":"تتميز بيانات ومعلومات محاسبة التكاليف عن المحاسبة المالية بأنها:","options":["شاملة وتعرض النتائج إجمالاً","تفصيلية وتعرض بالقيمة والكم معاً","أكثر دقة لأنها تعتمد على مستندات رسمية","إلزامية الإعداد وفق معايير محددة"],"correct":1},{"q":"أي من الأدوار التالية لا تقوم به محاسبة التكاليف؟","options":["إمداد الإدارة ببيانات للتخطيط","الرقابة على عناصر التكاليف","إعداد القوائم المالية للجهات الخارجية","المساعدة في اتخاذ القرارات التسعيرية"],"correct":2},{"q":"تهدف محاسبة التكاليف إلى قياس الأداء الفعلي بصورة تفصيلية بهدف:","options":["إعداد قائمة الدخل للمنشأة ككل","مقارنة الأداء مع المنشآت المماثلة","الرقابة وتقييم الأداء على مستوى الأقسام والمنتجات","تحديد قيمة الزكاة المستحقة"],"correct":2},{"q":"تُستخدم بيانات التكاليف في عملية اتخاذ القرارات، ومن أمثلة ذلك:","options":["تحديد أسعار البيع فقط","تقييم أداء الإدارات فقط","قرارات التسعير، والمفاضلة بين الشراء والتصنيع، وتقييم الأداء","إعداد الميزانية العمومية فقط"],"correct":2},{"q":"مفهوم \"التكلفة\" في محاسبة التكاليف يشير إلى:","options":["المبلغ الذي يدفعه العميل مقابل المنتج","مقدار ما تدفعه أو تتحمله المنشأة للحصول على سلعة أو خدمة","القيمة السوقية للأصول في نهاية الفترة","إجمالي الإيرادات مطروحاً منها المصروفات"],"correct":1},{"q":"عناصر التكاليف الأساسية في المنشآت الصناعية هي:","options":["مواد مباشرة، أجور مباشرة، وتكاليف تسويقية","مواد مباشرة، أجور مباشرة، وخدمات أخرى (تكاليف صناعية غير مباشرة)","مواد مباشرة، أجور غير مباشرة، ومصروفات إدارية","تك ثابتة للوحدة تنقص بزيادة الإنتاج"},{"q":"الطاقة غير المستغلة من التكاليف الثابتة تحسب على أساس الفرق بين التكلفة الثابتة الكلية والتكلفة الثابتة المستغلة.","answer":true,"explain":""},{"q":"نسبة الاستغلال هي نسبة النشاط الفعلي إلى الطاقة الإنتاجية المتاحة.","answer":true,"explain":""},{"q":"التكاليف المتغيرة للوحدة تتغير بتغير حجم النشاط في المدى الملائم.","answer":false,"explain":"التكلفة المتغيرة للوحدة ثابتة"},{"q":"في المدى الملائم، العلاقة بين التكلفة الكلية وحجم النشاط علاقة خطية.","answer":true,"explain":""},{"q":"التكاليف التاريخية (الغارقة) يجب أن تؤخذ في الاعتبار عند اتخاذ القرارات المستقبلية.","answer":false,"explain":"لا تؤخذ في الاعتبار لأنها لا يمكن تغييرها"},{"q":"التكاليف الحدية تساعد في تحديد الربح الإضافي من بيع وحدة إضافية.","answer":true,"explain":""}],"u3":[{"q":"نظام أوامر الإنتاج يستخدم في المنشآت التي تنتج منتجاً واحداً بكميات كبيرة ومتطابقة.","answer":false,"explain":"يستخدم في المنشآت التي تنتج منتجات حسب طلب العميل"},{"q":"بطاقة الأمر الإنتاجي تجمع عليها جميع تكاليف الأمر من مواد وأجور وتكاليف غير مباشرة.","answer":true,"explain":""},{"q":"بطاقة المواد تستخدم لتحديد تكلفة المواد المباشرة التي صرفت لكل أمر إنتاجي.","answer":true,"explain":""},{"q":"بطاقة العمل تستخدم لتجميع ساعات العمل المباشرة والأجور المستحقة لكل أمر.","answer":true,"explain":""},{"q":"التكاليف الصناعية غير المباشرة الفعلية تحمل على الأوامر الإنتاجية مباشرة عند حدوثها.","answer":false,"explain":"تحمل باستخدام معدل تحميل تقديري، وليس الفعلية"},{"q":"معدل تحميل التكاليف الصناعية غير المباشرة يحسب بقسمة التكاليف الفعلية على الأساس الفعلي.","answer":false,"explain":"يحسب بقسمة التكاليف التقديرية على الأساس التقديري"},{"q":"الفرق بين التكاليف المحملة والفعلية يسمى فرق تحميل التكاليف الصناعية غير المباشرة.","answer":true,"explain":""},{"q":"إذا كانت التكاليف المحملة أكبر من الفعلية، فإن فرق التحميل يكون بالنقصان.","answer":false,"explain":"يكون بالزيادة"},{"q":"المعالجة الأكثر شيوعاً لفرق التحميل هي تحميله بالكامل في حساب تكلفة البضاعة المباعة.","answer":true,"explain":""},{"q":"إذا كان فرق التحميل كبيراً نسبياً، فإنه يوزع على حسابات الإنتاج تحت التشغيل، والإنتاج التام، وتكلفة البضاعة المباعة.","answer":true,"explain":""},{"q":"القيد المحاسبي لإثبات تكلفة الأمر التام هو: من حـ/ مراقبة الإنتاج تحت التشغيل إلى حـ/ مراقبة الإنتاج التام.","answer":false,"explain":"العكس: من الإنتاج التام إلى تحت التشغيل"},{"q":"القيد المحاسبي لإثبات تكلفة الأمر المباع هو: من حـ/ تكلفة البضاعة المباعة إلى حـ/ مراقبة الإنتاج التام.","answer":true,"explain":""},{"q":"حساب مراقبة الإنتاج تحت التشغيل يمثل تكلفة الأوامر الجاري إنتاجها في نهاية الفترة.","answer":true,"explain":""},{"q":"حساب مراقبة الإنتاج التام يمثل تكلفة الأوامر التامة غير المباعة في نهاية الفترة.","answer":true,"explain":""},{"q":"المواد غير المباشرة تحمل مباشرة على حساب مراقبة الإنتاج تحت التشغيل.","answer":false,"explain":"تحمل على حساب مراقبة التكاليف الصناعية غير المباشرة الفعلية"},{"q":"الأجور غير المباشرة تحمل على حساب مراقبة التكاليف الصناعية غير المباشرة الفعلية.","answer":true,"explain":""},{"q":"يتم إقفال حساب مراقبة التكاليف الصناعية غير المباشرة الفعلية في حساب مراقبة التكاليف غير المباشرة المحملة في نهاية الفترة.","answer":true,"explain":"بعد معالجة فرق التحميل"},{"q":"في نظام الأوامر، يتم تحديد تكلفة الوحدة بقسمة إجمالي تكاليف الفترة على عدد الوحدات المنتجة.","answer":false,"explain":"يتم تحديد تكلفة كل أمر على حدة"},{"q":"أسس تحميل التكاليف غير المباشرة قد تكون ساعات العمل المباشرة أو تكلفة الأجور المباشرة.","answer":true,"explain":""},{"q":"معدل التحميل التقديري يستخدم لتقويم المخزون من الإنتاج تحت التشغيل والتام.","answer":true,"explain":""}],"u4":[{"q":"نقطة التعادل هي حجم النشاط الذي يكون عنده الربح صفراً.","answer":true,"explain":""},{"q":"حجم التعادل بالوحدات = التكاليف الثابتة الكلية ÷ هامش المساهمة للوحدة.","answer":true,"explain":""},{"q":"هامش المساهمة للوحدة = سعر البيع -- التكلفة المتغيرة للوحدة.","answer":true,"explain":""},{"q":"إذا زادت التكاليف الثابتة، فإن حجم التعادل ينقص.","answer":false,"explain":"يزيد"},{"q":"إذا زادت التكاليف المتغيرة للوحدة، فإن هامش المساهمة يزداد.","answer":false,"explain":"ينقص"},{"q":"هامش الأمان هو الفرق بين المبيعات الفعلية ومبيعات التعادل.","answer":true,"explain":""},{"q":"في تحليل التعادل لمنتجات متعددة، يتم حساب متوسط هامش المساهمة كمتوسط حسابي بسيط لهامش المساهمة لكل منتج.","answer":false,"explain":"يتم حسابه كمتوسط مرجح حسب نسب التشكيلة البيعية"},{"q":"قيمة التعادل بالريال = التكاليف الثابتة ÷ نسبة هامش المساهمة.","answer":true,"explain":""},{"q":"نسبة هامش المساهمة = هامش المساهمة للوحدة ÷ سعر البيع للوحدة.","answer":true,"explain":""},{"q":"في حالة زيادة المخزون (الإنتاج > المبيعات)، يكون الربح في الطريقة الإجمالية أكبر من الربح في الطريقة المتغيرة.","answer":true,"explain":""},{"q":"في الطريقة المتغيرة الصناعية، يتم تحميل المنتج بالتكاليف الصناعية المتغيرة فقط.","answer":true,"explain":""},{"q":"في الطريقة المباشرة، يتم تحميل المنتج بالتكاليف المباشرة فقط (مواد وأجور).","answer":true,"explain":""},{"q":"الطريقة المستغلة تحمل المنتج بالتكاليف المتغيرة وجزء من التكاليف الثابتة على أساس نسبة الاستغلال.","answer":true,"explain":""},{"q":"الطاقة غير المستغلة تعالج كتكلفة منتج مؤجلة في الطريقة المستغلة.","answer":false,"explain":"تعالج كمصروف فترة"},{"q":"المصروفات البيعية والإدارية تظهر في قائمة الدخل بعد مجمل الربح.","answer":true,"explain":""},{"q":"قائمة التكاليف تهدف إلى تحديد تكلفة الإنتاج التام خلال الفترة.","answer":true,"explain":""},{"q":"تكلفة البضاعة المباعة في المنشأة الصناعية = تكلفة الإنتاج التام أول المدة + تكلفة الإنتاج التام خلال الفترة -- تكلفة الإنتاج التام آخر المدة.","answer":true,"explain":""},{"q":"مجمل الربح = المبيعات -- تكلفة البضاعة المباعة.","answer":true,"explain":""},{"q":"صافي الربح = مجمل الربح -- إجمالي المصروفات البيعية والإدارية.","answer":true,"explain":""},{"q":"التكاليف الصناعية غير المباشرة تشمل مصاريف الدعاية والإعلان.","answer":false,"explain":"الدعاية والإعلان تكاليف بيعية"}],"u5":[{"q":"التكاليف المعيارية هي تكاليف محددة مسبقاً تمثل ما يجب أن تكون عليه التكاليف في ظل ظروف كفاءة معينة.","answer":true,"explain":""},{"q":"تحليل الانحرافات يهدف إلى تحديد أسباب الاختلاف بين الأداء الفعلي والمعياري.","answer":true,"explain":""},{"q":"الموازنة الساكنة تعد على أساس مستوى نشاط واحد (مخطط).","answer":true,"explain":""},{"q":"الموازنة المرنة تعد على أساس مستوى نشاط واحد فقط.","answer":false,"explain":"تعد لمستويات نشاط متعددة أو على أساس النشاط الفعلي"},{"q":"انحراف الموازنة الساكنة الإجمالي = الدخل الفعلي -- الدخل المخطط.","answer":true,"explain":""},{"q":"يمكن تقسيم انحراف الموازنة الساكنة إلى انحراف الموازنة المرنة وانحراف حجم المبيعات.","answer":true,"explain":""},{"q":"انحراف سعر المواد = (السعر الفعلي -- السعر المعياري) × الكمية الفعلية.","answer":true,"explain":""},{"q":"انحراف كفاءة المواد = (الكمية الفعلية -- الكمية المعيارية) × السعر الفعلي.","answer":false,"explain":"يضرب في السعر المعياري وليس الفعلي"},{"q":"انحراف معدل الأجر = (معدل الأجر الفعلي -- معدل الأجر المعياري) × الساعات الفعلية.","answer":true,"explain":""},{"q":"انحراف كفاءة العمل = (الساعات الفعلية -- الساعات المعيارية) × معدل الأجر المعياري.","answer":true,"explain":""},{"q":"إذا كان السعر الفعلي للمادة أقل من المعياري، فإن انحراف السعر يكون غير صالح.","answer":false,"explain":"يكون صالحاً لأنه يوفر تكلفة"},{"q":"الانحرافات التي تكون في غير صالح المنشأة تعني زيادة التكاليف الفعلية عن المعيارية أو نقص الإيرادات عن المخطط.","answer":true,"explain":""},{"q":"الانحرافات الصغيرة عادة تعالج في حساب تكلفة البضاعة المباعة.","answer":true,"explain":""},{"q":"تحليل الانحرافات يساعد في تقييم أداء الإدارات المختلفة وتحديد المسؤوليات.","answer":true,"explain":""},{"q":"انحراف الموازنة المرنة للأجور = انحراف معدل الأجر + انحراف كفاءة العمل.","answer":true,"explain":""}]},"essay":{"u1":[{"q":"عرّف محاسبة التكاليف، وبيّن الهدف الرئيسي منها.","a":"محاسبة التكاليف هي فرع من فروع المحاسبة يهتم بتجميع وقياس وتحليل وتفسير المعلومات المتعلقة بالتكاليف، بهدف تزويد الإدارة بالبيانات اللازمة للتخطيط والرقابة واتخاذ القرارات. هدفها الرئيسي هو مساعدة الإدارة في أداء وظائفها بكفاءة."},{"q":"اذكر أوجه التشابه بين محاسبة التكاليف والمحاسبة المالية.","a":"1. كلاهما يقوم بإعداد الحسابات الختامية ويتبعان نفس المبادئ والإجراءات المحاسبية. 2. تقدم محاسبة التكاليف بيانات تكلفة المنتج والمخزون للمحاسبة المالية، مما يساعدها في إعداد قائمة الدخل والمركز المالي. 3. تحقق كل منهما رقابة على بعضهما البعض."},{"q":"اذكر أوجه الاختلاف بين محاسبة التكاليف والمحاسبة المالية من حيث مستخدمي التقرير.","a":"مستخدمو محاسبة التكاليف هم أطراف داخلية في المنشأة (جميع المستويات الإدارية)، بينما مستخدمو المحاسبة المالية هم أطراف خارجية (ملاك، دائنون، مستثمرون، جهات حكومية)."},{"q":"بيّن الفرق بين المحاسبة المالية ومحاسبة التكاليف من حيث طبيعة البيانات التي تتعامل معها كل منهما.","a":"محاسبة التكاليف تهتم بالماضي والحاضر والمستقبل، وتستخدم البيانات الفعلية للتخطيط للمستقبل، وهي أقل دقة لأنها تخضع للتنبؤ. بينما المحاسبة المالية تهتم بالبيانات التاريخية الفعلية فقط، وتتميز بدقة أكبر لأنها تعتمد على مستندات."},{"q":"عرّف \"التكلفة\" في مفهوم محاسبة التكاليف.","a":"التكلفة هي مقدار ما تدفعه أو تتحمله المنشأة من نقد أو ما يعادله للحصول على سلعة أو خدمة، أو هي المبلغ الذي يبذل لتحقيق غرض معين، ويقاس بالمبلغ النقدي الذي يتعين دفعه للحصول على المنافع."},{"q":"ما هي عناصر التكاليف الأساسية في المنشآت الصناعية؟ اشرحها بإيجاز.","a":"العناصر الأساسية هي: - المواد المباشرة: المواد التي تدخل في تكوين المنتج ويمكن تتبعها بسهولة. - الأجور المباشرة: أجور العمال الذين يعملون مباشرة على تحويل المواد إلى منتج. - الخدمات الأخرى (التكاليف الصناعية غير المباشرة): جميع التكاليف الأخرى اللازمة للإنتاج والتي لا تدخل ضمن المواد والأجور المباشرة، مثل الاستهلاك والإيجار."},{"q":"عرّف التكاليف المباشرة، مع ذكر مثالين.","a":"التكاليف المباشرة هي التكاليف التي يمكن ربطها أو تتبعها بوحدة المنتج النهائي بسهولة وبدقة. مثال: (1) المواد الأولية الداخلة في المنتج، (2) أجور العمال الذين يعملون على خط الإنتاج مباشرة."},{"q":"عرّف التكاليف غير المباشرة، مع ذكر مثالين.","a":"التكاليف غير المباشرة هي التكاليف التي لا يمكن ربطها أو تتبعها بوحدة المنتج بسهولة، فهي تخص الإنتاج بشكل عام. مثال: (1) مرتب مدير المصنع، (2) إيجار المبنى الصناعي."},{"q":"ما هو التبويب الطبيعي للتكاليف؟ وما هي أقسامه الرئيسية؟","a":"هو تقسيم التكاليف حسب طبيعتها أو نوعها. أقسامه الرئيسية هي: 1. تكلفة المواد (مباشرة وغير مباشرة). 2. تكلفة الأجور (مباشرة وغير مباشرة). 3. تكلفة الخدمات الأخرى (مثل الاستهلاك، الإيجار، التأمين)."},{"q":"ما هو التبويب الوظيفي للتكاليف؟ وما هي الوظائف الرئيسية التي يقوم عليها؟","a":"هو تبويب التكاليف حسب الوظائف الرئيسية التي تنشأ فيها داخل المنشأة. الوظائف الرئيسية هي: 1. الوظيفة الصناعية (الإنتاجية). 2. الوظيفة التسويقية (البيعية). 3. الوظيفة الإدارية."},{"q":"عرّف التكاليف المتغيرة، مع ذكر مثال.","a":"التكاليف المتغيرة هي التي تتغير بتغير حجم النشاط (الإنتاج أو المبيعات) بشكل طردي. مثال: تكلفة المواد المباشرة المستخدمة في الإنتاج، حيث تزداد بزيادة الوحدات المنتجة."},{"q":"عرّف التكاليف الثابتة، مع ذكر مثال.","a":"التكاليف الثابتة هي التي لا تتغير بتغير حجم النشاط خلال المدى الملائم. مثال: إيجار مبنى المصنع، حيث يظل ثابتاً سواء أنتجت المنشأة 1000 وحدة أو 5000 وحدة."},{"q":"عرّف التكاليف شبه المتغيرة (المختلطة)، مع ذكر مثال.","a":"التكاليف شبه المتغيرة هي التي تحتوي على جزء ثابت وجزء متغير. مثال: فاتورة الكهرباء التي تتكون من رسم اشتراك ثابت بالإضافة إلى استهلاك متغير حسب كمية الاستخدام."},{"q":"إذا زاد حجم الإنتاج، كيف يتغير كل من إجمالي التكاليف المتغيرة والتكلفة المتغيرة للوحدة؟ ولماذا؟","a":"إجمالي التكاليف المتغيرة يزداد بزيادة الإنتاج (علاقة طردية). أما التكلفة المتغيرة للوحدة فتبقى ثابتة، لأنها تمثل تكلفة الوحدة الواحدة التي لا تتغير بتغير الكمية في المدى الملائم."},{"q":"إذا زاد حجم الإنتاج، كيف يتغير كل من إجمالي التكاليف الثابتة والتكلفة الثابتة للوحدة؟ ولماذا؟","a":"إجمالي التكاليف الثابتة يبقى ثابتاً بغض النظر عن حجم الإنتاج في المدى الملائم. أما التكلفة الثابتة للوحدة فتنقص بزيادة الإنتاج، لأن التكلفة الثابتة الكلية توزع على عدد أكبر من الوحدات."},{"q":"ما هو المدى الملائم للنشاط، وما أهميته في تحليل سلوك التكاليف؟","a":"المدى الملائم هو نطاق مستوى النشاط الذي تكون فيه العلاقة بين التكلفة وحجم النشاط خطية، وتكون فيه التكاليف الثابتة والمتغيرة للوحدة ثابتة. أهميته أنه يسمح بالتنبؤ الدقيق بسلوك التكلفة عند تغير النشاط ضمن هذا النطاق."},{"q":"اذكر أنواع التبويب حسب علاقة عنصر التكلفة بحجم النشاط.","a":"يهدف إلى تقسيم التكاليف حسب علاقتها بحجم النشاط إلى: 1. تكاليف متغيرة. 2. تكاليف ثابتة. 3. تكاليف شبه متغيرة."},{"q":"اذكر أنواع التبويب حسب علاقة عنصر التكلفة بوحدة النشاط.","a":"يهدف إلى تتبع عناصر التكلفة بوحدة المنتج النهائي، ويقسمها إلى: 1. تكاليف مباشرة. 2. تكاليف غير مباشرة."},{"q":"اذكر أنواع التبويب حسب علاقة عنصر التكلفة بالطاقة المستغلة وغير المستغلة.","a":"يتم تقسيم التكاليف الثابتة إلى: 1. تكاليف ثابتة تتعلق بالطاقة المستغلة. 2. تكاليف ثابتة تتعلق بالطاقة غير المستغلة (العاطلة)."},{"q":"ما الفرق بين التكاليف الصناعية والتكاليف غير الصناعية (فترة)؟","a":"التكاليف الصناعية هي التكاليف التي تنشأ داخل المصنع وترتبط بعملية الإنتاج (مواد، أجور، خدمات صناعية)، وتدخل في تكوين تكلفة المخزون. أما التكاليف غير الصناعية فهي تتعلق بفترة زمنية محددة (مصاريف بيعية وإدارية) ولا تدخل في تكلفة المخزون، بل تظهر كمصروفات في قائمة الدخل عند حدوثها. ---"}],"u2":[{"q":"ما المقصود بتحليل سلوك التكاليف؟ وما الهدف منه؟","a":"تحليل سلوك التكاليف هو دراسة كيفية استجابة التكلفة للتغير في مستوى النشاط. الهدف منه هو فصل الجزء الثابت عن الجزء المتغير في التكاليف المختلطة لمساعد الإدارة في التخطيط والرقابة واتخاذ القرارات."},{"q":"اشرح بإيجاز طريقة أعلى وأدنى مستوى في تحليل سلوك التكاليف.","a":"تعتمد على تحديد أعلى وأدنى مستوى للنشاط، ثم حساب التكلفة المتغيرة للوحدة بقسمة الفرق في التكلفة بين المستويين على الفرق في حجم النشاط بينهما. ثم يتم حساب الجزء الثابت بطرح (المتغير للوحدة × حجم النشاط) من إجمالي التكلفة عند أي من المستويين."},{"q":"اشرح بإيجاز طريقة شكل الانتشار (البيانية) في تحليل سلوك التكاليف.","a":"تعتمد على رسم العلاقة بين التكلفة (المحور الرأسي) وحجم النشاط (المحور الأفقي) على رسم بياني. يتم رسم نقاط البيانات، ثم رسم خط بياني يمر بأغلب النقاط ليمثل اتجاه التكلفة. بناءً على هذا الخط، يمكن تحديد الجزء الثابت (نقطة تقاطع الخط مع محور التكاليف) والمتغير (ميل الخط)."},{"q":"ما هي معادلة التكاليف الخطية العامة؟ وضح دلالة كل رمز فيها.","a":"المعادلة هي: ص = أ + ب س، حيث: - ص: إجمالي التكاليف. - أ: إجمالي التكاليف الثابتة (الجزء الثابت). - ب: التكلفة المتغيرة للوحدة (معدل التغير). - س: حجم النشاط (عدد الوحدات أو ساعات العمل)."},{"q":"إذا كانت معادلة التكاليف هي ص = 80,000 + 6 س (حيث س = عدد الوحدات). احسب إجمالي التكاليف عند إنتاج 10,000 وحدة، وحدد التكاليف الثابتة والمتغيرة.","a":"إجمالي التكاليف = 80,000 + (6 × 10,000) = 80,000 + 60,000 = 140,000 ريال. التكاليف الثابتة = 80,000 ريال. التكاليف المتغيرة = 60,000 ريال (أو 6 ريال للوحدة)."},{"q":"كيف يتم حساب التكلفة المتغيرة للوحدة باستخدام طريقة أعلى وأدنى مستوى؟","a":"التكلفة المتغيرة للوحدة = (التكلفة عند أعلى مستوى نشاط - التكلفة عند أدنى مستوى نشاط) ÷ (أعلى مستوى نشاط - أدنى مستوى نشاط)."},{"q":"كيف يتم حساب التكاليف الثابتة بعد حساب التكلفة المتغيرة للوحدة في طريقة أعلى وأدنى مستوى؟","a":"التكاليف الثابتة = إجمالي التكاليف عند المستوى الأعلى (أو الأدنى) - (التكلفة المتغيرة للوحدة × حجم النشاط عند نفس المستوى)."},{"q":"ما هي التكاليف الغارقة (التاريخية)؟ أعط مثالاً.","a":"هي تكاليف تم تكبدها بالفعل في الماضي، ولا يمكن تغييرها أو استردادها بالقرار الحالي، وبالتالي فهي غير ذات صلة باتخاذ القرارات المستقبلية. مثال: ثمن آلة تم شراؤها منذ سنوات، ولا يؤثر هذا الثمن على قرار استبدالها أو الاستمرار بها الآن."},{"q":"ما هي تكلفة الفرصة البديلة؟ أعط مثالاً.","a":"هي الدخل أو المنفعة التي يتم التخلي عنها عند اختيار بديل عن آخر. مثال: إذا استخدمت المنشأة مساحة المصنع لإنتاج منتج جديد بدلاً من تأجيرها، فإن إيجار المساحة الذي تم التخلي عنه يمثل تكلفة الفرصة البديلة."},{"q":"ما هي التكاليف الحدية؟","a":"هي التكلفة الإضافية التي تتكبدها المنشأة نتيجة إنتاج وحدة إضافية واحدة من المنتج."},{"q":"عرّف التكاليف الثابتة الملزمة، مع ذكر مثال.","a":"هي تكاليف ثابتة لا يمكن تغييرها على المدى القصير لأنها تتعلق بالهيكل الأساسي للمنشأة مثل الإيجارات طويلة الأجل، واستهلاك الآلات، ورواتب الإدارة العليا. مثال: استهلاك مبنى المصنع."},{"q":"عرّف التكاليف التقديرية (الاختيارية)، مع ذكر مثال.","a":"هي تكاليف ثابتة يمكن للإدارة تغييرها أو تخفيضها حسب الحاجة، وتتعلق بقرارات الإدارة التقديرية. مثال: مصاريف الدعاية والإعلان، والتدريب، والبحث والتطوير."},{"q":"ما الفرق بين التكاليف التفاضلية والتكاليف الغارقة من حيث الصلة باتخاذ القرار؟","a":"التكاليف التفاضلية هي التي تختلف بين البدائل وتكون ذات صلة بالقرار، أما التكاليف الغارقة فهي تكاليف تاريخية لا تختلف بين البدائل ولا تؤثر في القرار الحالي."},{"q":"اذكر أهم طرق تحليل سلوك التكاليف التي تعتمد على التحليل الإحصائي للبيانات التاريخية.","a":"الطرق الرئيسية هي: طريقة أعلى وأدنى مستوى، وطريقة شكل الانتشار (الرسم البياني)، وطريقة تحليل الانحدار (المربعات الصغرى) والتي تعتبر الأكثر دقة."},{"q":"لماذا تعتبر طريقة تحليل الانحدار أكثر دقة من طريقة أعلى وأدنى مستوى؟","a":"لأن طريقة الانحدار تستخدم جميع نقاط البيانات المتاحة، وليس نقطتين فقط، مما يقلل من تأثير القيم الشاذة ويعطي تقديراً إحصائياً أكثر دقة للعلاقة بين التكلفة وحجم النشاط."},{"q":"في تحليل سلوك التكاليف، ما العلاقة بين التكلفة المتغيرة للوحدة وحجم النشاط؟","a":"العلاقة طردية بين إجمالي التكاليف المتغيرة وحجم النشاط، ولكن التكلفة المتغيرة للوحدة تظل ثابتة بغض النظر عن حجم النشاط ضمن المدى الملائم."},{"q":"في تحليل سلوك التكاليف، ما العلاقة بين إجمالي التكاليف الثابتة وحجم النشاط؟","a":"إجمالي التكاليف الثابتة لا يتغير بتغير حجم النشاط ضمن المدى الملائم (علاقة ثابتة)، أي أنه يظل كما هو عند مستويات الإنتاج المختلفة."},{"q":"ما هو مفهوم \"نسبة الاستغلال\" في سياق التكاليف الثابتة؟","a":"هي نسبة النشاط الفعلي إلى الطاقة الإنتاجية المتاحة. وتستخدم لتحديد الجزء المستغل من التكاليف الثابتة والجزء العاطل (غير المستغل)، حيث: الطاقة المستغلة = التكاليف الثابتة الكلية × نسبة الاستغلال، والطاقة غير المستغلة = التكاليف الثابتة الكلية - الطاقة المستغلة."},{"q":"إذا كانت الطاقة المتاحة 15,000 وحدة، والإنتاج الفعلي 12,000 وحدة، احسب نسبة الطاقة المستغلة.","a":"نسبة الطاقة المستغلة = (النشاط الفعلي ÷ الطاقة المتاحة) × 100 = (12,000 ÷ 15,000) × 100 = 80%."},{"q":"متى تكون التكلفة شبه المتغيرة؟ اشرح بالمعادلة.","a":"تكون التكلفة شبه المتغيرة عندما تحتوي على عنصرين: عنصر ثابت لا يتغير بتغير النشاط، وعنصر متغير يتغير بتغير النشاط. وتعبر عنها بالمعادلة: ص = أ + ب س، حيث أ هو الجزء الثابت و ب هو معدل التغير للوحدة. ---"}],"u3":[{"q":"ما هو نظام أوامر الإنتاج؟ وفي أي نوع من المنشآت يستخدم؟","a":"هو نظام محاسبي يستخدم لتجميع وتخصيص التكاليف لكل أمر إنتاجي أو دفعة إنتاجية على حدة. يستخدم في المنشآت التي تنتج منتجات متنوعة حسب مواصفات كل عميل، مثل صناعة الأثاث والملابس حسب الطلب، والطباعة، والبناء."},{"q":"ما هي بطاقة الأمر الإنتاجي (بطاقة التكاليف)؟ وما فائدتها؟","a":"هي مستند رئيسي في نظام الأوامر يجمع عليه جميع تكاليف الأمر الإنتاجي (مواد مباشرة، أجور مباشرة، تكاليف غير مباشرة محملة). فائدتها أنها تحدد التكلفة الإجمالية للأمر وتكلفة الوحدة منه، وتساعد في الرقابة على التكاليف."},{"q":"ما هي بطاقة المواد (أمر صرف المواد)؟ وما استخدامها؟","a":"هي مستند يستخدم لطلب وصرف المواد من المخزن، ويوضح نوع وكمية المواد المطلوبة للأمر الإنتاجي المعين. تستخدم لتحديد تكلفة المواد المباشرة الخاصة بكل أمر."},{"q":"ما هي بطاقة العمل؟ وما المعلومات التي تحتوي عليها؟","a":"هي مستند يستخدم لتسجيل ساعات العمل المباشرة التي يؤديها العمال على الأوامر الإنتاجية. تحتوي على اسم العامل، رقمه، القسم، تاريخ العمل، عدد الساعات العادية والإضافية، وتستخدم لحساب الأجور المباشرة المستحقة لكل أمر."},{"q":"ما هو معدل تحميل التكاليف الصناعية غير المباشرة؟ وكيف يتم حسابه؟","a":"هو معدل تقديري يستخدم لتوزيع التكاليف الصناعية غير المباشرة على الأوامر الإنتاجية قبل معرفة التكاليف الفعلية. يحسب بقسمة إجمالي التكاليف الصناعية غير المباشرة التقديرية على إجمالي الأساس التقديري (مثل ساعات العمل المباشرة، أو تكلفة الأجور المباشرة)."},{"q":"لماذا تستخدم التكاليف الصناعية غير المباشرة التقديرية بدلاً من الفعلية في نظام الأوامر؟","a":"لأسباب عملية أهمها: 1. الرغبة في تحديد تكلفة المنتج فور إتمامه دون انتظار حصر بعض التكاليف غير المباشرة الفعلية (مثل فاتورة الكهرباء). 2. تفادي التقلبات الموسمية في التكاليف غير المباشرة (مثل تكاليف التدفئة) التي لا تعكس الكفاءة الحقيقية. 3. لتسهيل عملية التسعير واتخاذ القرارات في الوقت المناسب."},{"q":"عرّف فرق تحميل التكاليف الصناعية غير المباشرة، وكيف ينشأ؟","a":"هو الفرق بين إجمالي التكاليف الصناعية غير المباشرة المحملة (التقديرية) وإجمالي التكاليف الصناعية غير المباشرة الفعلية. ينشأ بسبب عدم تطابق التكاليف التقديرية مع الفعلية في نهاية الفترة."},{"q":"ما هي المعالجة المحاسبية الأكثر شيوعاً لفرق تحميل التكاليف الصناعية غير المباشرة في نهاية الفترة؟","a":"المعالجة الأكثر شيوعاً عملياً هي تحميل الفرق بالكامل في حساب تكلفة البضاعة المباعة، وذلك لسهولتها وقلة الإجراءات التي تتطلبها."},{"q":"متى يتم توزيع فرق تحميل التكاليف الصناعية غير المباشرة على الحسابات الثلاثة (تحت التشغيل، التام، المباع)؟","a":"يتم توزيعه نسبياً على الحسابات الثلاثة عندما يكون حجم الانحراف (الفرق) كبيراً نسبياً بحيث يؤثر بشكل رئيسي على التكاليف، للحصول على تكاليف أكثر دقة."},{"q":"اكتب القيد المحاسبي لتحميل المواد المباشرة على أوامر الإنتاج.","a":"- من حـ/ مراقبة الإنتاج تحت التشغيل - إلى حـ/ مراقبة المخازن (مواد مباشرة)"},{"q":"اكتب القيد المحاسبي لتحميل الأجور المباشرة المستحقة على أوامر الإنتاج.","a":"- من حـ/ مراقبة الإنتاج تحت التشغيل - إلى حـ/ الأجور المباشرة المستحقة"},{"q":"اكتب القيد المحاسبي لتحميل التكاليف الصناعية غير المباشرة التقديرية على أوامر الإنتاج.","a":"- من حـ/ مراقبة الإنتاج تحت التشغيل - إلى حـ/ مراقبة التكاليف الصناعية غير المباشرة المحملة (التقديرية)"},{"q":"اكتب القيد المحاسبي لإثبات التكاليف الصناعية غير المباشرة الفعلية (مواد غير مباشرة، أجور غير مباشرة).","a":"- من حـ/ مراقبة التكاليف الصناعية غير المباشرة الفعلية - إلى مذكورين: - حـ/ مراقبة المخازن (مواد غير مباشرة) - حـ/ الأجور غير المباشرة المستحقة - حـ/ استهلاك الآلات - حـ/ الدائنون (مصاريف أخرى)"},{"q":"اكتب القيد المحاسبي لإقفال حساب التكاليف الصناعية غير المباشرة (عند وجود فرق تحميل بالنقصان) في حساب تكلفة البضاعة المباعة.","a":"(إذا كانت المحملة 7,080 ريال، والفعلية 8,716 ريال، أي فرق نقصان 1,636 ريال) - من مذكورين: - حـ/ مراقبة التكاليف الصناعية غير المباشرة المحملة (تقديرية) 7,080 - حـ/ تكلفة البضاعة المباعة (فرق التحميل) 1,636 - إلى حـ/ مراقبة التكاليف الصناعية غير المباشرة الفعلية 8,716"},{"q":"اكتب القيد المحاسبي لإقفال حساب التكاليف الصناعية غير المباشرة (عند وجود فرق تحميل بالزيادة) في حساب تكلفة البضاعة المباعة.","a":"(إذا كانت المحملة 20,000 ريال، والفعلية 15,000 ريال، أي فرق زيادة 5,000 ريال) - من حـ/ مراقبة التكاليف الصناعية غير المباشرة المحملة (تقديرية) 20,000 - إلى مذكورين: - حـ/ تكلفة البضاعة المباعة (فرق التحميل) 5,000 - حـ/ مراقبة التكاليف الصناعية غير المباشرة الفعلية 15,000"},{"q":"اكتب القيد المحاسبي لإثبات تكلفة الأوامر الإنتاجية التامة في نهاية الفترة.","a":"- من حـ/ مراقبة الإنتاج التام - إلى حـ/ مراقبة الإنتاج تحت التشغيل"},{"q":"اكتب القيد المحاسبي لإثبات تكلفة الأوامر الإنتاجية التي تم بيعها وتسليمها للعملاء.","a":"- من حـ/ تكلفة البضاعة المباعة - إلى حـ/ مراقبة الإنتاج التام"},{"q":"ما هو الحساب الذي يمثل تكلفة الأوامر الجاري إنتاجها في نهاية الفترة؟","a":"حساب مراقبة الإنتاج تحت التشغيل، حيث يمثل رصيده المدينة تكلفة الأوامر التي لم تنتهِ بعد في نهاية الفترة المحاسبية."},{"q":"ما هو الحساب الذي يمثل تكلفة الأوامر التامة غير المباعة في نهاية الفترة؟","a":"حساب مراقبة الإنتاج التام، حيث يمثل رصيده المدينة تكلفة الأوامر التي تم إنتاجها بالكامل ولم تبع بعد."},{"q":"إذا كانت تكلفة أمر إنتاجي تتكون من مواد مباشرة 4,000 ريال، وأجور مباشرة 6,000 ريال، ومعدل تحميل التكاليف غير المباشرة 50% من الأجور، احسب التكلفة الإجمالية للأمر.","a":"التكاليف غير المباشرة المحملة = 50% × 6,000 = 3,000 ريال. التكلفة الإجمالية = 4,000 + 6,000 + 3,000 = 13,000 ريال. ---"}],"u4":[{"q":"عرّف نقطة التعادل، وما أهميتها للإدارة؟","a":"نقطة التعادل هي حجم النشاط (مبيعات أو إنتاج) الذي يتساوى عنده إجمالي الإيرادات مع إجمالي التكاليف، ويكون الربح صفراً. أهميتها أنها تساعد الإدارة في تحديد الحد الأدنى من المبيعات اللازم لتغطية التكاليف، وتقييم المخاطر، واتخاذ القرارات التسعيرية."},{"q":"اكتب معادلة حساب حجم التعادل بالوحدات.","a":"حجم التعادل بالوحدات = التكاليف الثابتة الكلية ÷ هامش المساهمة للوحدة. حيث هامش المساهمة للوحدة = سعر البيع للوحدة - التكلفة المتغيرة للوحدة."},{"q":"اكتب معادلة حساب قيمة التعادل بالريال.","a":"قيمة التعادل بالريال = التكاليف الثابتة الكلية ÷ نسبة هامش المساهمة. حيث نسبة هامش المساهمة = هامش المساهمة للوحدة ÷ سعر البيع للوحدة."},{"q":"عرّف هامش المساهمة، وما أهميته في تحليل التعادل؟","a":"هامش المساهمة هو الفرق بين سعر البيع والتكلفة المتغيرة للوحدة، وهو المبلغ الذي تساهم به كل وحدة مباعة في تغطية التكاليف الثابتة وتحقيق الربح. أهميته أنه الأساس في حساب نقطة التعادل وتحليل الربحية."},{"q":"إذا كانت التكاليف الثابتة 100,000 ريال، وسعر البيع 30 ريال، والتكلفة المتغيرة للوحدة 14 ريال. احسب هامش المساهمة للوحدة، ونقطة التعادل بالوحدات، وقيمة التعادل.","a":"- هامش المساهمة للوحدة = 30 - 14 = 16 ريال. - حجم التعادل بالوحدات = 100,000 ÷ 16 = 6,250 وحدة. - قيمة التعادل بالريال = 6,250 × 30 = 187,500 ريال (أو 100,000 ÷ (16/30) = 187,500)."},{"q":"عرّف هامش الأمان، وكيف يحسب بالوحدات والنسبة؟","a":"هامش الأمان هو الفرق بين المبيعات الفعلية أو المتوقعة ومبيعات التعادل. يحسب: - بالوحدات: المبيعات الفعلية بالوحدات - مبيعات التعادل بالوحدات. - بالنسبة: (المبيعات الفعلية - مبيعات التعادل) ÷ المبيعات الفعلية × 100."},{"q":"إذا كانت المبيعات الفعلية 20,000 وحدة، ومبيعات التعادل 15,000 وحدة، احسب هامش الأمان بالوحدات والنسبة.","a":"- هامش الأمان بالوحدات = 20,000 - 15,000 = 5,000 وحدة. - نسبة هامش الأمان = (5,000 ÷ 20,000) × 100 = 25%."},{"q":"ما هو أثر زيادة التكاليف الثابتة مع ثبات باقي العوامل على نقطة التعادل؟","a":"زيادة التكاليف الثابتة تؤدي إلى زيادة نقطة التعادل (أي تحتاج المنشأة إلى بيع عدد أكبر من الوحدات لتغطية التكاليف)، مع بقاء هامش المساهمة للوحدة كما هو."},{"q":"ما هو أثر زيادة التكاليف المتغيرة للوحدة مع ثبات باقي العوامل على نقطة التعادل وهامش المساهمة؟","a":"زيادة التكلفة المتغيرة للوحدة تؤدي إلى انخفاض هامش المساهمة للوحدة، وبالتالي زيادة نقطة التعادل (علاقة عكسية بين التكلفة المتغيرة وهامش المساهمة، وطردية بين التكلفة المتغيرة وحجم التعادل)."},{"q":"كيف يتم حساب نقطة التعادل في حالة تعدد المنتجات (التشكيلة البيعية)؟","a":"يتم ذلك عن طريق: 1. حساب متوسط سعر البيع للتشكيلة = (سعر بيع أ × نسبة أ) + (سعر بيع ب × نسبة ب) + ... 2. حساب متوسط التكلفة المتغيرة للوحدة للتشكيلة = (ت.م. أ × نسبة أ) + (ت.م. ب × نسبة ب) + ... 3. حساب متوسط هامش المساهمة = متوسط سعر البيع - متوسط التكلفة المتغيرة. 4. حجم التعادل للتشكيلة = التكاليف الثابتة الكلية ÷ متوسط هامش المساهمة. 5. توزيع حجم التعادل على المنتجات حسب نسب التشكيلة."},{"q":"ما الفرق بين الطريقة الإجمالية الصناعية والطريقة المتغيرة الصناعية في حساب تكلفة المنتج؟","a":"في الطريقة الإجمالية، يتم تحميل المنتج بجميع التكاليف الصناعية (متغيرة وثابتة). أما في الطريقة المتغيرة، يتم تحميل المنتج بالتكاليف المتغيرة فقط، وتعتبر التكاليف الصناعية الثابتة من مصروفات الفترة."},{"q":"ما هي الطريقة المباشرة في قياس التكاليف؟","a":"هي طريقة يتم فيها تحميل المنتج بالتكاليف المباشرة فقط (مواد وأجور مباشرة)، بينما تعتبر جميع التكاليف غير المباشرة (صناعية وبيعية وإدارية) من مصروفات الفترة."},{"q":"ما هي طريقة قياس التكاليف على أساس الطاقة المستغلة؟","a":"هي طريقة يتم فيها تحميل المنتج بالتكاليف المتغيرة بالإضافة إلى الجزء المستغل فقط من التكاليف الثابتة (على أساس نسبة الاستغلال)، ويعالج الجزء غير المستغل من التكاليف الثابتة كمصروف فترة (طاقة عاطلة)."},{"q":"متى يكون الربح في الطريقة الإجمالية الصناعية أكبر من الربح في الطريقة المتغيرة الصناعية؟","a":"عندما يكون الإنتاج الفعلي أكبر من المبيعات (أي وجود زيادة في المخزون)، حيث يتم تحميل جزء من التكاليف الثابتة في المخزون في الطريقة الإجمالية، مما يقلل من مصروفات الفترة ويزيد الربح مقارنة بالطريقة المتغيرة التي تحمل كل التكاليف الثابتة كمصروفات فترة."},{"q":"ما هي المصروفات البيعية والإدارية في المنشأة الصناعية، وكيف تظهر في قائمة الدخل؟","a":"هي مصروفات غير صناعية تتعلق بوظائف البيع والإدارة (مثل رواتب مندوبي المبيعات، الدعاية، رواتب الإدارة). تظهر في قائمة الدخل بعد حساب مجمل الربح، ويتم خصمها للحصول على صافي الربح."},{"q":"اذكر خطوات إعداد قائمة التكاليف في المنشأة الصناعية بإيجاز.","a":"1. حساب تكلفة المواد المستخدمة (مخزون أول المدة + مشتريات - مخزون آخر المدة). 2. إضافة الأجور المباشرة. 3. إضافة التكاليف الصناعية غير المباشرة. 4. الحصول على إجمالي تكاليف الإنتاج. 5. إضافة مخزون الإنتاج تحت التشغيل أول المدة، وطرح مخزون الإنتاج تحت التشغيل آخر المدة للحصول على تكلفة الإنتاج التام."},{"q":"كيف يتم حساب تكلفة البضاعة المباعة في المنشأة الصناعية؟","a":"تكلفة البضاعة المباعة = تكلفة الإنتاج التام أول المدة + تكلفة الإنتاج التام خلال الفترة (من قائمة التكاليف) - تكلفة الإنتاج التام آخر المدة."},{"q":"ما هو مجمل الربح في المنشأة الصناعية، وكيف يحسب؟","a":"مجمل الربح (الربح الإجمالي) هو الفرق بين إيرادات المبيعات وتكلفة البضاعة المباعة. يعبر عن الربح المحقق من النشاط الصناعي قبل خصم المصروفات البيعية والإدارية."},{"q":"في قائمة الدخل للمنشأة الصناعية، كيف يتم الوصول إلى صافي الربح؟","a":"صافي الربح = مجمل الربح - إجمالي المصروفات البيعية والإدارية (التي تشمل المصروفات البيعية والإدارية الثابتة والمتغيرة)."},{"q":"ما هي أفضل طريقة لقياس التكاليف في المنشآت التي تعاني من طاقة عاطلة كبيرة، ولماذا؟","a":"الطريقة المستغلة تعتبر أفضل، لأنها تفصل تكلفة الطاقة غير المستغلة وتظهرها كمصروف فترة، مما يعطي صورة أوضح عن كفاءة استخدام الطاقة الإنتاجية ويسمح للإدارة بمعرفة الخسائر الناتجة عن عدم استغلال الطاقة. ---"}],"u5":[{"q":"عرّف التكاليف المعيارية، وما الهدف من استخدامها؟","a":"هي تكاليف محددة مسبقاً على أساس علمي، تمثل ما يجب أن تكون عليه التكاليف في ظل ظروف كفاءة معينة. الهدف منها هو التخطيط، الرقابة، تقييم الأداء، وتحليل الانحرافات."},{"q":"ما هو تحليل الانحرافات؟ وما أهميته؟","a":"هو عملية تحديد الفروق بين الأداء الفعلي والأداء المعياري (المخطط)، وتحليل أسباب هذه الفروق. أهميته في مساعدة الإدارة على تحديد مواطن القوة والضعف، واتخاذ إجراءات تصحيحية للرقابة على التكاليف وتحسين الأداء."},{"q":"عرّف الموازنة الساكنة (الثابتة).","a":"هي موازنة تعد على أساس مستوى نشاط واحد (مخطط) قبل بداية الفترة، ولا تتغير مع تغير حجم النشاط الفعلي، وتستخدم للمقارنة مع النتائج الفعلية لتحديد الانحراف الإجمالي."},{"q":"عرّف الموازنة المرنة.","a":"هي موازنة تعد لمستويات نشاط متعددة، أو تعيد حساب التكاليف والإيرادات بناءً على مستوى النشاط الفعلي المحقق في نهاية الفترة، وتستخدم لفصل تأثير التغير في حجم النشاط عن تأثير الكفاءة."},{"q":"وضح كيف يتم تحليل انحراف الموازنة الساكنة الإجمالي.","a":"يتم تحليله إلى: 1. انحراف الموازنة المرنة: وهو الفرق بين النتائج الفعلية والموازنة المرنة (على أساس النشاط الفعلي)، ويعكس كفاءة الإدارة في التحكم بالتكاليف والإيرادات. 2. انحراف حجم المبيعات: وهو الفرق بين الموازنة المرنة والموازنة الساكنة (على أساس النشاط المخطط)، ويعكس أثر تغير حجم المبيعات الفعلي عن المخطط."},{"q":"اكتب صيغة حساب انحراف سعر المواد.","a":"انحراف سعر المواد = (السعر الفعلي للمادة - السعر المعياري للمادة) × الكمية الفعلية للمادة المستخدمة."},{"q":"اكتب صيغة حساب انحراف كفاءة (كمية) المواد.","a":"انحراف كفاءة المواد = (الكمية الفعلية للمادة المستخدمة - الكمية المعيارية المسموح بها للإنتاج الفعلي) × السعر المعياري للمادة."},{"q":"اكتب صيغة حساب انحراف معدل الأجر.","a":"انحراف معدل الأجر = (معدل الأجر الفعلي للساعة - معدل الأجر المعياري للساعة) × عدد ساعات العمل الفعلية."},{"q":"اكتب صيغة حساب انحراف كفاءة (ساعات) العمل.","a":"انحراف كفاءة العمل = (عدد ساعات العمل الفعلية - عدد ساعات العمل المعيارية المسموح بها للإنتاج الفعلي) × معدل الأجر المعياري للساعة."},{"q":"إذا كانت الكمية الفعلية للمادة 12,500 كجم بسعر 8 ريال، والكمية المعيارية 10,000 كجم بسعر 7.5 ريال. احسب انحراف السعر وانحراف الكفاءة للمواد، وحدد ما إذا كانت في صالح أم غير صالح المنشأة.","a":"- انحراف السعر = (8 - 7.5) × 12,500 = 0.5 × 12,500 = 6,250 ريال (غير صالح) لأن السعر الفعلي أعلى من المعياري. - انحراف الكفاءة = (12,500 - 10,000) × 7.5 = 2,500 × 7.5 = 18,750 ريال (غير صالح) لأن الكمية الفعلية أكبر من المعيارية. - إجمالي انحراف الموازنة المرنة للمواد = 6,250 + 18,750 = 25,000 ريال (غير صالح)."},{"q":"إذا كانت ساعات العمل الفعلية 12,000 ساعة بمعدل 5 ريال، والساعات المعيارية 10,000 ساعة بمعدل 4.75 ريال. احسب انحراف معدل الأجر وانحراف كفاءة العمل.","a":"- انحراف معدل الأجر = (5 - 4.75) × 12,000 = 0.25 × 12,000 = 3,000 ريال (غير صالح). - انحراف كفاءة العمل = (12,000 - 10,000) × 4.75 = 2,000 × 4.75 = 9,500 ريال (غير صالح)."},{"q":"متى يكون الانحراف في صالح المنشأة؟","a":"يكون الانحراف في صالح المنشأة عندما تكون التكاليف الفعلية أقل من التكاليف المعيارية، أو عندما تكون الإيرادات الفعلية أكبر من الإيرادات المخططة. مثال: انخفاض سعر المادة الفعلي عن المعياري، أو انخفاض كمية المواد المستخدمة عن المعيارية."},{"q":"ما هو انحراف الموازنة المرنة للمواد، وكيف يحسب؟","a":"هو الفرق بين تكلفة المواد الفعلية وتكلفة المواد المعيارية المسموح بها للإنتاج الفعلي. يحسب = (الكمية الفعلية × السعر الفعلي) - (الكمية المعيارية × السعر المعياري)، ويساوي مجموع انحراف السعر وانحراف الكفاءة للمواد."},{"q":"ما هو انحراف الموازنة المرنة للأجور، وكيف يحسب؟","a":"هو الفرق بين تكلفة الأجور الفعلية وتكلفة الأجور المعيارية المسموح بها للإنتاج الفعلي. يحسب = (الساعات الفعلية × معدل الأجر الفعلي) - (الساعات المعيارية × معدل الأجر المعياري)، ويساوي مجموع انحراف معدل الأجر وانحراف كفاءة العمل."},{"q":"لماذا يتم تحليل الانحرافات إلى انحرافات سعر وانحرافات كفاءة؟ وما الفائدة من ذلك؟","a":"يتم التحليل لتحديد المسؤولية بدقة. انحراف السعر يرتبط عادة بقسم المشتريات (سعر المواد) أو قسم الموارد البشرية (معدل الأجر)، بينما انحراف الكفاءة يرتبط بقسم الإنتاج (كمية المواد أو ساعات العمل). هذه الدقة تساعد في محاسبة المسؤولية واتخاذ إجراءات تصحيحية محددة."},{"q":"ما هو الفرق بين إجمالي انحراف المواد في الموازنة المرنة وإجمالي انحراف الموازنة الساكنة؟","a":"إجمالي انحراف الموازنة المرنة للمواد يقارن التكلفة الفعلية بالتكلفة المعيارية على أساس الإنتاج الفعلي، ويعكس كفاءة الإدارة. أما انحراف الموازنة الساكنة فيقارن التكلفة المعيارية على أساس الإنتاج الفعلي بالتكلفة المعيارية على أساس الإنتاج المخطط، ويعكس أثر اختلاف حجم الإنتاج."},{"q":"كيف يتم التعامل مع الانحرافات في نهاية الفترة المحاسبية في نظام التكاليف المعيارية؟","a":"يتم إقفال حسابات الانحرافات في حساب تكلفة البضاعة المباعة، أو توزيعها على حسابات المخزون (الإنتاج تحت التشغيل، التام، وتكلفة البضاعة المباعة) حسب حجمها. في العادة، تعالج الانحرافات الصغيرة في تكلفة البضاعة المباعة، بينما توزع الانحرافات الكبيرة."},{"q":"ما هي الموازنة التخطيطية، وما دور محاسبة التكاليف فيها؟","a":"الموازنة التخطيطية هي خطة مالية تفصيلية للفترة القادمة تعبر عن أهداف المنشأة. دور محاسبة التكاليف هو تزويد الإدارة بالبيانات التفصيلية عن سلوك التكاليف والعلاقة بين التكلفة والنشاط، مما يساعد في إعداد موازنات مرنة وتخطيط التكاليف بدقة."},{"q":"اشرح العلاقة بين نظام التكاليف المعيارية وتحليل الانحرافات ونظام الرقابة الداخلية.","a":"نظام التكاليف المعيارية يضع معايير للأداء، وتحليل الانحرافات يقارن الأداء الفعلي بتلك المعايير، مما يكشف عن نقاط الضعف أو القوة. هذا يشكل أداة رقابية فعالة تمكن الإدارة من تحديد المسؤوليات، واتخاذ إجراءات تصحيحية، وتحسين الأداء المستقبلي، وبالتالي تعزيز نظام الرقابة الداخلية."},{"q":"إذا كانت الشركة تنتج 10,000 وحدة فعلياً، فما هي الكمية المعيارية للمواد اللازمة إذا كانت كل وحدة تحتاج إلى 2 كجم، وانتهى الأمر باستخدام 22,000 كجم فعلياً، والسعر المعياري 5 ريال، احسب انحراف كفاءة المواد.","a":"- الكمية المعيارية = 10,000 وحدة × 2 كجم/وحدة = 20,000 كجم. - انحراف كفاءة المواد = (الكمية الفعلية - الكمية المعيارية) × السعر المعياري = (22,000 - 20,000) × 5 = 2,000 × 5 = 10,000 ريال (غير صالح)."}]},"game":{"u1":[{"q":"وفق التبويب الطبيعي وعلاقة البند بالمنتج، يُصنَّف البند «الخشب المستخدم في صناعة الأثاث» على أنه:","options":["مواد مباشرة","مواد غير مباشرة","أجور (عمل) مباشرة","أجور (عمل) غير مباشرة","خدمات مباشرة","خدمات غير مباشرة"],"correct":0,"why":"مادة يمكن تتبعها ورؤية أثرها في المنتج النهائي، فهي مواد مباشرة.","game":"matrix"},{"q":"وفق التبويب الطبيعي وعلاقة البند بالمنتج، يُصنَّف البند «الأقمشة في مصنع الملابس» على أنه:","options":["مواد مباشرة","مواد غير مباشرة","أجور (عمل) مباشرة","أجور (عمل) غير مباشرة","خدمات مباشرة","خدمات غير مباشرة"],"correct":0,"why":"مادة أساسية تدخل في القطعة ويمكن تحميلها عليها مباشرة.","game":"matrix"},{"q":"وفق التبويب الطبيعي وعلاقة البند بالمنتج، يُصنَّف البند «الجلود في مصنع الأحذية» على أنه:","options":["مواد مباشرة","مواد غير مباشرة","أجور (عمل) مباشرة","أجور (عمل) غير مباشرة","خدمات مباشرة","خدمات غير مباشرة"],"correct":0,"why":"مادة خام رئيسة تُتتبَّع في كل زوج منتَج.","game":"matrix"},{"q":"وفق التبويب الطبيعي وعلاقة البند بالمنتج، يُصنَّف البند «الحديد في صناعة الأبواب» على أنه:","options":["مواد مباشرة","مواد غير مباشرة","أجور (عمل) مباشرة","أجور (عمل) غير مباشرة","خدمات مباشرة","خدمات غير مباشرة"],"correct":0,"why":"مادة رئيسة ظاهرة في المنتج ويمكن قياس نصيب الوحدة منها.","game":"matrix"},{"q":"وفق التبويب الطبيعي وعلاقة البند بالمنتج، يُصنَّف البند «الورق في مطبعة» على أنه:","options":["مواد مباشرة","مواد غير مباشرة","أجور (عمل) مباشرة","أجور (عمل) غير مباشرة","خدمات مباشرة","خدمات غير مباشرة"],"correct":0,"wh ل، وساعات العمل المباشرة المقدرة 60,000 ساعة. معدل التحميل التقديري يساوي:","options":["5.21 ريال لكل ساعة","5.17 ريال لكل ساعة","60 ريال لكل ساعة","5 ريالات لكل ساعة"],"correct":3,"why":"معدل التحميل = 300,000 ÷ 60,000 = 5 ريالات لكل ساعة عمل مباشرة.","game":"oh"},{"q":"إذا كان معدل تحميل ت.ص.غ.م 5 ريالات لكل ساعة عمل مباشرة، وبلغت الساعات الفعلية 58,000 ساعة، فإن ت.ص.غ.م المحمَّلة تساوي:","options":["302,000 ريال","310,000 ريال","290,000 ريال","300,000 ريال"],"correct":2,"why":"المحمَّلة = 5 × 58,000 = 290,000 ريال.","game":"oh"},{"q":"بلغت ت.ص.غ.م الفعلية 302,000 ريال، والمحمَّلة 290,000 ريال. فرق التحميل واتجاهه:","options":["10,000 ريال بالزيادة (تحميل أكثر)","12,000 ريال بالنقص (تحميل أقل)","12,000 ريال بالزيادة (تحميل أكثر)","2,000 ريال بالنقص (تحميل أقل)"],"correct":1,"why":"الفرق = 302,000 − 290,000 = 12,000 ريال، والمحمَّل أقل من الفعلي فهو تحميل بالنقص.","game":"oh"}],"u4":[{"q":"إذا زاد سعر بيع الوحدة (مع ثبات باقي العوامل)، فإن هامش المساهمة للوحدة:","options":["يرتفع","ينخفض","لا يتغير"],"correct":0,"why":"هامش المساهمة = سعر البيع − التكلفة المتغيرة، فزيادة السعر ترفعه (علاقة طردية).","game":"sens"},{"q":"إذا زاد سعر بيع الوحدة (مع ثبات باقي العوامل)، فإن نقطة التعادل:","options":["ترتفع","تنخفض","لا تتغير"],"correct":1,"why":"ارتفاع الهامش يزيد نصيب الوحدة من تغطية الثابتة، فتنخفض نقطة التعادل.","game":"sens"},{"q":"إذا زادت التكلفة المتغيرة للوحدة (مع ثبات باقي العوامل)، فإن هامش المساهمة:","options":["يرتفع","ينخفض","لا يتغير"],"correct":1,"why":"العلاقة بين التكلفة المتغيرة للوحدة وهامش المساهمة عكسية، فزيادتها تخفض الهامش.","game":"sens"},{"q":"إذا زادت التكلفة المتغيرة للوحدة (مع ثبات باقي العوامل)، فإن نقطة التعادل:","options":["ترتفع","تنخفض","لا تتغير"],"correct":0,"why":"انخفاض الهامش يقلّل تغطية كل وحدة للثابتة، فترتفع نقطة التعادل.","game":"sens"},{"q":"إذا زادت التكاليف الثابتة (مع ثبات الهامش)، فإن نقطة التعادل:","options":["ترتفع","تنخفض","لا تتغير"],"correct":0,"why":"نقطة التعادل = الثابتة ÷ الهامش، فزيادة الثابتة ترفعها.","game":"sens"},{"q":"إذا زادت التكاليف الثابتة (مع ثبات السعر والتكلفة المتغيرة)، فإن هامش المساهمة للوحدة:","options":["يرتفع","ينخفض","لا يتغير"],"correct":2,"why":"الهامش يعتمد على السعر والتكلفة المتغيرة فقط، ولا علاقة له بالتكاليف الثابتة.","game":"sens"},{"q":"إذا انخفضت التكلفة المتغيرة للوحدة (مع ثبات باقي العوامل)، فإن نقطة التعادل:","options":["ترتفع","تنخفض","لا تتغير"],"correct":1,"why":"انخفاض التكلفة المتغيرة يرفع الهامش، فتنخفض نقطة التعادل.","game":"sens"},{"q":"إذا انخفض سعر بيع الوحدة (مع ثبات باقي العوامل)، فإن نقطة التعادل:","options":["ترتفع","تنخفض","لا تتغير"],"correct":0,"why":"انخفاض السعر يقلّل الهامش، فترتفع نقطة التعادل.","game":"sens"},{"q":"كلما زاد هامش الأمان، فإن ذلك يدل على:","options":["اقتراب المنشأة من الخطر","ابتعاد المنشأة عن منطقة الخطر","تساوي الإيراد والتكلفة","زيادة التكاليف الثابتة"],"correct":1,"why":"هامش الأمان الأكبر يعني بُعد المبيعات الفعلية عن نقطة التعادل، فيزداد الأمان.","game":"sens"},{"q":"العلاقة بين التكلفة المتغيرة للوحدة وهامش المساهمة هي علاقة:","options":["طردية","عكسية","لا توجد علاقة","ثابتة"],"correct":1,"why":"كلما زادت التكلفة المتغيرة للوحدة نقص هامش المساهمة، فالعلاقة عكسية.","game":"sens"},{"q":"نقطة التعادل هي النقطة التي:","options":["تزيد فيها الإيرادات عن التكاليف","تتساوى فيها التكاليف الكلية مع الإيرادات الكلية","تزيد فيها التكاليف عن الإيرادات","يتحقق فيها أعلى ربح"],"correct":1,"why":"عند التعادل تتساوى التكاليف الكلية مع الإيرادات الكلية، ونتيجة النشاط تساوي صفراً.","game":"sens"},{"q":"أيٌّ مما يلي ليس من فرضيات تحليل التعادل؟","options":["ثبات إجمالي التكاليف الثابتة","ثبات أسعار البيع","تغيّر كفاءة عوامل الإنتاج باستمرار","إمكانية تبويب التكاليف إلى ثابتة ومتغيرة"],"correct":2,"why":"من فرضيات التعادل ثبات عوامل الإنتاج لا تغيّرها؛ فالخيار الثالث مخالف للفرضيات.","game":"sens"},{"q":"هامش المساهمة للوحدة يساوي:","options":["سعر البيع − التكلفة المتغيرة للوحدة","سعر البيع − التكاليف الثابتة","التكاليف الثابتة ÷ عدد الوحدات","الإيرادات − إجمالي التكاليف"],"correct":0,"why":"هامش المساهمة للوحدة = سعر بيع الوحدة − التكلفة المتغيرة للوحدة.","game":"sens"},{"q":"نقطة التعادل بالوحدات تُحسب بـ:","options":["التكاليف الثابتة × هامش المساهمة","التكاليف الثابتة ÷ هامش المساهمة للوحدة","هامش المساهمة ÷ التكاليف الثابتة","سعر البيع ÷ التكلفة المتغيرة"],"correct":1,"why":"نقطة التعادل بالوحدات = التكاليف الثابتة ÷ هامش المساهمة للوحدة.","game":"sens"},{"q":"نسبة هامش المساهمة تُحسب بـ:","options":["هامش المساهمة للوحدة ÷ سعر بيع الوحدة","سعر البيع ÷ هامش المساهمة","التكاليف الثابتة ÷ المبيعات","التكلفة المتغيرة ÷ سعر البيع"],"correct":0,"why":"نسبة هامش المساهمة = هامش المساهمة للوحدة ÷ سعر بيع الوحدة.","game":"sens"},{"q":"عدد الوحدات لتحقيق ربح مستهدف يُحسب بـ:","options":["(الثابتة − الربح) ÷ الهامش","(الثابتة + الربح المستهدف) ÷ هامش المساهمة للوحدة","الربح ÷ الهامش","الثابتة ÷ (الهامش − الربح)"],"correct":1,"why":"عدد الوحدات = (التكاليف الثابتة + الربح المستهدف) ÷ هامش المساهمة للوحدة.","game":"sens"},{"q":"على خريطة التعادل، النقطة التي يتقاطع عندها خط الإيرادات الكلية مع خط التكاليف الكلية تمثل:","options":["نقطة التعادل","منطقة الربح","منطقة الخسارة","خط التكاليف الثابتة","خط التكاليف الكلية","خط الإيرادات الكلية"],"correct":0,"why":"عندها تتساوى الإيرادات الكلية مع التكاليف الكلية فتكون النتيجة صفراً.","game":"cvp"},{"q":"على خريطة التعادل، المنطقة الواقعة يمين نقطة التعادل حيث يعلو خط الإيرادات فوق خط التكاليف الكلية تمثل:","options":["نقطة التعادل","منطقة الربح","منطقة الخسارة","خط التكاليف الثابتة","خط التكاليف الكلية","خط الإيرادات الكلية"],"correct":1,"why":"الإيرادات أكبر من التكاليف الكلية فتتحقق الأرباح.","game":"cvp"},{"q":"على خريطة التعادل، المنطقة الواقعة يسار نقطة التعادل حيث يعلو خط التكاليف الكلية فوق خط الإيرادات تمثل:","options":["نقطة التعادل","منطقة الربح","منطقة الخسارة","خط التكاليف الثابتة","خط التكاليف الكلية","خط الإيرادات الكلية"],"correct":2,"why":"التكاليف الكلية أكبر من الإيرادات فتتحقق الخسائر.","game":"cvp"},{"q":"على خريطة التعادل، الخط الأفقي الموازي للمحور الأفقي يمثل:","options":["نقطة التعادل","منطقة الربح","منطقة الخسارة","خط التكاليف الثابتة","خط التكاليف الكلية","خط الإيرادات الكلية"],"correct":3,"why":"إجمالي التكاليف الثابتة لا يتغير بتغير حجم النشاط.","game":"cvp"},{"q":"على خريطة التعادل، الخط الذي يبدأ من مستوى التكاليف الثابتة على المحور الرأسي ثم يرتفع بميل التكلفة المتغيرة للوحدة هو:","options":["نقطة التعادل","منطقة الربح","منطقة الخسارة","خط التكاليف الثابتة","خط التكاليف الكلية","خط الإيرادات الكلية"],"correct":4,"why":"التكاليف الكلية = الثابتة + المتغيرة، فيبدأ من مستوى الثابتة.","game":"cvp"},{"q":"على خريطة التعادل، الخط الذي يبدأ من نقطة الأصل ويرتفع بميل سعر بيع الوحدة هو:","options":["نقطة التعادل","منطقة الربح","منطقة الخسارة","خط التكاليف الثابتة","خط التكاليف الكلية","خط الإيرادات الكلية"],"correct":5,"why":"لا إيراد عند صفر مبيعات، ويزيد الإيراد بمقدار سعر البيع لكل وحدة.","game":"cvp"},{"q":"سعر بيع الوحدة 150 ريالاً، والتكلفة المتغيرة للوحدة 90 ريالاً، والتكاليف الثابتة 120,000 ريال. هامش المساهمة للوحدة يساوي:","options":["240 ريالاً","800 ريال","90 ريالاً","60 ريالاً"],"correct":3,"why":"هامش المساهمة = 150 − 90 = 60 ريالاً.","game":"be"},{"q":"سعر بيع الوحدة 150 ريالاً، والتكلفة المتغيرة للوحدة 90 ريالاً، والتكاليف الثابتة 120,000 ريال. نقطة التعادل بالوحدات تساوي:","options":["1,333 وحدة","4,000 وحدة","2,000 وحدة","800 وحدة"],"correct":2,"why":"نقطة التعادل = 120,000 ÷ 60 = 2,000 وحدة.","game":"be"},{"q":"سعر بيع الوحدة 150 ريالاً، والتكلفة المتغيرة للوحدة 90 ريالاً، والتكاليف الثابتة 120,000 ريال. نسبة هامش المساهمة تساوي:","options":["150٪","40٪","60٪","66.7٪"],"correct":1,"why":"النسبة = 60 ÷ 150 = 40٪.","game":"be"},{"q":"سعر بيع الوحدة 150 ريالاً، والتكلفة المتغيرة للوحدة 90 ريالاً، والتكاليف الثابتة 120,000 ريال. نقطة التعادل بالقيمة (بالريال) تساوي:","options":["300,000 ريال","180,000 ريال","120,000 ريال","200,000 ريال"],"correct":0,"why":"التعادل بالقيمة = 120,000 ÷ 40٪ = 300,000 ريال (= 2,000 × 150).","game":"be"},{"q":"سعر بيع الوحدة 150 ريالاً، والتكلفة المتغيرة للوحدة 90 ريالاً، والتكاليف الثابتة 120,000 ريال. عدد الوحدات اللازم بيعها لتحقيق رب function advance(){
  if(S.mixed){
    S.mix.n++;
    if(S.mode==="teams"){ nextTurn(); if(S.qDone>=S.teamQ){ finish(); return true; } }
    else if(S.mix.n>=S.mix.target){ finish(); return true; }

}

const SORT_TIME=75;
const CATS={f:"ثابتة",v:"متغيرة",m:"مختلطة"};
const CATSUB={f:"لا تتغير بحجم الإنتاج",v:"تتغير طردياً مع الإنتاج",m:"جزء ثابت + جزء متغير"};
function sortStart(one){
  S.g={ deck:sh(GM_ITEMS), i:0, score:0, right:0, wrong:0, streak:0, bestStreak:0,
        lives:3, t:SORT_TIME, fb:null, picked:null };
  if(!one && S.mode==="solo") startTimer();
}
function sortAnswer(k){
  const g=S.g; if(g.fb) return;
  const it=g.deck[g.i], ok=it.k===k; g.picked=k; mark(ok);
  if(ok){ g.streak++; g.bestStreak=Math.max(g.bestStreak,g.streak);
    const mult=g.streak>=8?3:g.streak>=4?2:1; addScore(10*mult);
    g.fb={ok:true,mult,why:it.why,cat:CATS[it.k]};
  }else{ g.streak=0; g.lives--; g.fb={ok:false,why:it.why,cat:CATS[it.k]};
    logErr(it.t,CATS[it.k],CATS[k],it.why); }
  draw();
}
function sortNext(){
  const g=S.g; g.fb=null; g.picked=null;
  if(advance()) return;
  g.i++;
  if(g.lives<=0) return finish();
  if(g.i>=g.deck.length){ g.deck=sh(GM_ITEMS); g.i=0; }
  draw();
}
function sortView(){
  const g=S.g, it=g.deck[g.i];
  const btn=k=>{ let c="sb-"+k; if(g.fb){ if(k===it.k) c+=" right"; else if(k===g.picked) c+=" wrong"; }
    return `<button class="${c}" ${g.fb?"disabled":""} onclick="GM.sortAnswer('${k}')">${CATS[k]}<span>${CATSUB[k]}</span></button>`; };
  return `${hud(["📦 "+(g.i+1)])}
    <div class="gm-item ${g.fb?(g.fb.ok?"ok":"no"):""}">${E(it.t)}</div>
    <div class="gm-sortbtns">${btn("f")}${btn("v")}${btn("m")}</div>
    ${g.fb?`<div class="gm-fb ${g.fb.ok?"ok":"no"}">
      <b>${g.fb.ok?"إجابة صحيحة":"إجابة غير صحيحة"} — التصنيف الصحيح: ${g.fb.cat}</b>
      ${g.fb.ok&&g.fb.mult>1?`<span class="gm-combo">×${g.fb.mult} سلسلة ${g.streak}</span>`:""}
      <div>${E(g.fb.why)}</div></div>${nextBtn("GM.sortNext()")}`:""}`;
}

/* ============================================================
   و٢ – ٣) تحدي أعلى وأدنى مستوى
   ============================================================ */
function makeHL(){
  const b=pick([10,12,15,16,20,24,25,30]);
  const a=pick([8000,10000,12000,15000,18000,20000,21000,24000,25000,30000]);
  const base=pick([1500,2000,2250,2500]); const set=new Set();
  while(set.size<6) set.add(base+50*Math.floor(Math.random()*31));
  const xs=Array.from(set).sort((p,q)=>p-q);
  const lo=xs[0], hi=xs[xs.length-1], loC=a+b*lo, hiC=a+b*hi;
  const rows=xs.map(x=>{ let c=a+b*x;
    if(x!==lo&&x!==hi){ const nz=(Math.random()<.5?-1:1)*1000*(3+Math.floor(Math.random()*8));
      c=Math.min(hiC-1000,Math.max(loC+1000,c+nz)); }
    return {x,c}; });
  const mid=rows.filter(r=>r.x!==lo&&r.x!==hi);
  if(mid.length&&Math.random()<.45) pick(mid).c = hiC+1000*(2+Math.floor(Math.random()*7));
  const mid2=rows.filter(r=>r.x!==lo&&r.x!==hi&&r.c<=hiC);
  if(mid2.length&&Math.random()<.35){ const r=pick(mid2); r.c=Math.max(1000, loC-1000*(2+Math.floor(Math.random()*6))); }
  const newX=hi+50*(6+Math.floor(Math.random()*13));
  return { a,b,rows:sh(rows),lo,hi,loC,hiC,newX, pred:a+b*newX,
           unit:pick([["ساعة تشغيل الآلات","تكاليف الصيانة"],["ساعة عمل مباشرة","التكاليف الصناعية غير المباشرة"],["وحدة منتجة","تكاليف الكهرباء"]]) };
}
function hlStart(){ S.g={p:makeHL(), step:0, sel:[], val:"", fb:null, score:0,right:0,wrong:0, solved:0, target:S.mode==="teams"?1:3}; }
function hlPickRow(i){ const g=S.g; if(g.step!==0||g.fb) return;
  const k=g.sel.indexOf(i); if(k>=0) g.sel.splice(k,1); else if(g.sel.length<2) g.sel.push(i); draw(); }
function hlInput(v){ S.g.val=v; }
function hlCheck(){
  const g=S.g,p=g.p;
  if(g.step===0){
    if(g.sel.length!==2){ g.fb={ok:false,msg:"اختر صفّين: أعلى مستوى نشاط وأدنى مستوى نشاط."}; return draw(); }
    const xs=g.sel.map(i=>p.rows[i].x).sort((m,n)=>m-n);
    const ok=xs[0]===p.lo&&xs[1]===p.hi; mark(ok); if(ok) addScore(10);
    const maxC=Math.max.apply(null,p.rows.map(r=>r.c));
    if(!ok) logErr("تحديد أعلى وأدنى مستوى نشاط", N(p.hi)+" و "+N(p.lo), N(xs[1])+" و "+N(xs[0]),
                   "الاختيار على أساس مستوى النشاط لا على أساس التكلفة.");
    g.fb={ok, msg: ok?"الاختيار يعتمد على <b>مستوى النشاط</b> لا على قيمة التكلفة."
                    :"الاختيار يكون على أساس <b>مستوى النشاط</b> لا على أعلى تكلفة أو أدناها.",
      work:`أعلى مستوى نشاط = <b>${N(p.hi)}</b> وتكلفته ${N(p.hiC)} ريال<br>
            أدنى مستوى نشاط = <b>${N(p.lo)}</b> وتكلفته ${N(p.loC)} ريال`
        +(maxC>p.hiC?`<br>⚠ لاحظ أن أعلى <b>تكلفة</b> في الجدول (${N(maxC)}) ليست عند أعلى نشاط — ولهذا لا يصح الاختيار على أساس التكلفة.`:"") };
    return draw();
  }
  const v=parseFloat(String(g.val).replace(/[,\s]/g,""));
  if(isNaN(v)){ g.fb={ok:false,msg:"اكتب رقماً."}; return draw(); }
  const sp=[null,
    {t:p.b, pts:15, lab:"التكلفة المتغيرة للوحدة (ب)", u:"ريال للوحدة",
     w:`ب = (${N(p.hiC)} − ${N(p.loC)}) ÷ (${N(p.hi)} − ${N(p.lo)}) = ${N(p.hiC-p.loC)} ÷ ${N(p.hi-p.lo)} = <b>${N(p.b)}</b>`},
    {t:p.a, pts:15, lab:"الجزء الثابت (أ)", u:"ريال",
     w:`بالتعويض عند أعلى مستوى: ${N(p.hiC)} = أ + ${N(p.b)} × ${N(p.hi)}<br>أ = ${N(p.hiC)} − ${N(p.b*p.hi)} = <b>${N(p.a)}</b>`},
    {t:p.pred, pts:20, lab:"التكلفة المتوقعة", u:"ريال",
     w:`ص = ${N(p.a)} + ${N(p.b)} × ${N(p.newX)} = <b>${N(p.pred)}</b> ريال`}
  ][g.step];
  const ok=Math.abs(v-sp.t)<0.5; mark(ok); if(ok) addScore(sp.pts);
  if(!ok) logErr(sp.lab, N(sp.t)+" "+sp.u, N(v), sp.w.replace(/<[^>]+>/g,""));
  g.fb={ok, msg: ok?"":`الإجابة النموذجية: ${N(sp.t)} ${sp.u}.`, work:sp.w};
  draw();
}

  const asks=[

  ][st];
  return `${hud([S.mode==="teams"?"🧮 مسألة":"🧮 مسألة "+(g.solved+1)+" / "+g.target])}
